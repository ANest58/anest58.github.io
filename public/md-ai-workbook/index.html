day(12,2,{title:'Preparing the ZnPc small, standard and large models',
 goal:'Decide, with reasons, what each model contains and what level of theory and multiplicity it needs.',
 read:[['MCPB.py heme example (a planar N4 metal site like yours)','https://ambermd.org/tutorials/advanced/tutorial20/mcpbpy_heme.php','30 min'],['MCPB.py bonded model workflow','https://ambermd.org/tutorials/advanced/tutorial20/bonded_model.php','15 min']],
 sprint:{title:'Sprint: a model-definition log for ZnPc',
  problem:'<p>Write a short log: the net charge you assign to the organic residue and to the metal residue (so that the complex is neutral), the QM method and basis set you will try, the spin multiplicity, which atoms form the small model, whether the whole molecule can serve as the large model, and which failure you would look for in the optimized small model.</p>',
  hint:'<p>Zn(II) is d10 and closed shell, so the multiplicity is singlet. The phthalocyanine macrocycle is a dianion in the neutral ZnPc.</p>',
  solutionHtml:'<ul><li><b>Charges.</b> Metal residue ZN: +2. Organic residue: −2 (the Pc dianion). Total: 0. Each mol2 must carry its own correct total charge.</li><li><b>Multiplicity.</b> Singlet. For CuPc it would be a doublet and everything about the fitting becomes less trustworthy.</li><li><b>QM.</b> The tutorial example uses B3LYP/6-31G* for both models, with the same level for the small-model optimization and force constants. Try that first; the manual lists other engines.</li><li><b>Models.</b> A phthalocyanine is only 57 atoms, so the whole molecule can plausibly serve as the large model for the ESP. Decide whether a truncated core is enough for the small model, keeping the four ligating nitrogens and their neighbours.</li><li><b>Failure to check.</b> After optimization, confirm all four Zn-N bonds are intact and the core is planar. If a coordination bond breaks, change method or basis set, or obtain those parameters another way and edit the frcmod.</li></ul><p class="note-small">This is guidance for a decision, not an MCPB.py recipe: confirm each point against the tutorial and the AmberTools26 manual.</p>'},
 recall:[['Why is the neutral ZnPc a dianion ligand plus Zn(II)?','Phthalocyanine loses two protons to bind the metal, giving a 2− macrocycle; with Zn(2+) the complex is neutral.'],['Why must the small-model optimization and force-constant job use the same level of theory?','So the force constants are evaluated at a true minimum of the same surface.'],['What would make you doubt the QM geometry?','A broken metal-ligand bond, a nonplanar core when planarity is expected, or very different Zn-N lengths among the four bonds.']]});

day(12,3,{title:'Screening the frcmod against the tutorial criteria',
 goal:'Parse the metal-site parameters and apply the screening rules, including knowing when a rule does not apply.',
 read:[['MCPB.py tutorial: the section on checking the model and the ParmEd criteria','https://ambermd.org/tutorials/advanced/tutorial20/mcpbpy.php','20 min']],
 sprint:{title:'Sprint: a frcmod parser and the screening criteria',tested:true,
  problem:'<p>Parse the BOND and ANGLE sections of an MCPB.py-style frcmod and apply the tutorial\'s screening rules. Run it twice: applying every rule blindly, and then with an exception for a square-planar site. What changes, and what does that teach you about rules of thumb?</p>',
  hint:'<p>The angle rule that equilibrium angles exceed 100 degrees comes from tetrahedral and octahedral protein sites. In a square-planar macrocycle the cis N-Zn-N angle is 90 degrees by design.</p>',
  solution:'w12d3',
  why:'<p>A screening rule is a prior from other systems. Apply it, understand it, and know when your system is a legitimate exception.</p>'},
 recall:[['State the tutorial\'s screening rules.','Bond k below 200 kcal/mol/Å² with r0 below 2.8 Å; angle k below 100 kcal/mol/rad² with equilibrium angles above 100 degrees; metal dihedral barriers near zero; metal RESP charge below its oxidation state; LJ radius above 1 Å.'],['Which rule fails for square-planar ZnPc, and why is that fine?','The angle above 100 degrees rule, because cis N-Zn-N angles are about 90 degrees in a planar macrocycle.'],['Does passing the screen prove the model is good?','No. It is a sanity filter. A site that distorts under minimization or MD still means the model failed.']]});

day(12,4,{title:'Integration: validate against QM geometry',
 goal:'List the metal-site parameters from the topology and compare the MM geometry with the QM geometry quantitatively.',
 read:[['ParmEd documentation','https://parmed.github.io/ParmEd/html/index.html','20 min']],
 sprint:{title:'Sprint: ParmEd inspection and a geometry comparison',needs:'ParmEd and AmberTools',
  problem:'<p>Load your ZnPc topology with ParmEd and print every bond, angle and charge that involves the metal, flagging anything outside the criteria. Then minimize the ligand with MM in vacuum and compare the four Zn-N distances and the core RMSD with the QM-optimized structure, using your Kabsch code from week 6.</p>',
  hint:'<p>Report the error per bond, not just an average. Aim for Zn-N distances within a few hundredths of an angstrom of the QM values.</p>',
  solution:'w12d4'},
 recall:[['What validation targets show a metal parameter set is trustworthy?','Metal-ligand distances, angles, core planarity and, if available, key normal-mode frequencies against QM; and stability through minimization and a short run.'],['Why report per-bond errors?','An average can hide one badly wrong bond.'],['What does a distorted site after minimization indicate?','The bonded model or parameters are failing for that site; try a restrained nonbonded or dummy model, or a different approach.']]});

day(13,1,{title:'From molecular graphs to message passing',
 goal:'Write one message-passing layer and test that equivalent atoms get equal embeddings and that a readout is permutation invariant.',
 read:[['dmol.pub: the graph neural network chapters','https://dmol.pub/','35 min'],['PyTorch Geometric: introduction and hands-on GNN notebooks','https://pytorch-geometric.readthedocs.io/','optional']],
 watch:[['Stanford CS224W: machine learning with graphs (lecture playlist)','https://www.youtube.com/playlist?list=PLoROMvodv4rPLKxIpqhjhPgdQy7imNkDn']],
 explore:[['TeachOpenCADD: deep-learning talktorials','https://projects.volkamerlab.org/teachopencadd/'],['DeepChem','https://github.com/deepchem/deepchem']],
 sprint:{title:'Sprint: a message-passing layer on a water-like graph',tested:true,
  problem:'<p>Represent water as a three-node graph, write a message-passing layer that sums neighbour messages and updates each node, and verify (a) the two hydrogens get identical embeddings, and (b) a sum readout does not change if you relabel the atoms.</p>',
  hint:'<p>Messages: tanh(h_src · W_msg), summed at the destination. Update: tanh([h, m] · W_upd).</p>',
  solution:'w13d1'},
 recall:[['Why are graphs more natural than SMILES for molecules?','They carry the right symmetry and locality: relabelling atoms does not change the molecule.'],['What does a readout do?','It pools node embeddings into one molecule-level vector (or per-atom energies that are summed).'],['What is the limit of a plain message-passing network for 3-D structure?','It ignores geometry unless distances and angles are included; that is what equivariant models add.']]});

day(13,2,{title:'Equivariance and the SchNet to NequIP to MACE lineage',
 goal:'Test invariance of energy and equivariance of forces numerically, and know why equivariant networks are so data-efficient.',
 read:[['NequIP: E(3)-equivariant networks for interatomic potentials (arXiv, introduction and Figure 1)','https://arxiv.org/abs/2101.03164','25 min'],['MACE: higher-order equivariant message passing (arXiv, introduction)','https://arxiv.org/abs/2206.07697','15 min']],
 explore:[['e3nn: Euclidean neural networks library','https://github.com/e3nn/e3nn'],['NequIP code','https://github.com/mir-group/nequip']],
 sprint:{title:'Sprint: energy invariant, forces equivariant, tested numerically',tested:true,
  problem:'<p>With a pairwise toy potential, rotate all coordinates by a random proper rotation and check that the energy is unchanged and the forces rotate with the molecule. Confirm the forces really did change.</p>',
  hint:'<p>Rows of the coordinate array are atoms, so rotate with <code>x @ Q.T</code>.</p>',
  solution:'w13d2'},
 recall:[['Why must forces rotate with the molecule while the energy stays fixed?','Energy is a scalar (invariant); forces are its gradient, a vector field that must rotate with the coordinates (equivariant).'],['Why do equivariant models need less data?','Symmetry is built in, so the network need not learn separately that every rotated copy is the same physics.'],['What is a many-body expansion in the MACE idea?','Messages combine more than two neighbours at once, capturing higher-order correlations in a systematic way.']]});

day(13,3,{title:'ML potentials in practice, and their coverage limits',
 goal:'Run single points with two pretrained models and discover, by trying, which elements each one covers.',
 read:[['MACE documentation','https://mace-docs.readthedocs.io','20 min'],['UMA: a family of universal models for atoms (arXiv)','https://arxiv.org/abs/2506.23971','20 min']],
 explore:[['MACE repository (MACE-OFF and MACE-MP models)','https://github.com/ACEsuit/mace'],['fairchem: UMA and OMol25 code','https://github.com/facebookresearch/fairchem'],['UMA demo on Hugging Face','https://facebook-fairchem-uma-demo.hf.space']],
 sprint:{title:'Sprint: benzene with MACE-OFF, water with UMA, then try a metal',needs:'ASE, MACE and fairchem (UMA needs Hugging Face access)',
  problem:'<p>Compute single-point energies and forces for benzene with MACE-OFF and for water with the UMA omol task. Then try a zinc or copper complex with MACE-OFF and read the error. Which one covers metal complexes, and what must you set for an open-shell system?</p>',
  hint:'<p>MACE-OFF covers only H, C, N, O, F, P, S, Cl, Br and I. UMA\'s omol task was trained on OMol25, which includes metal complexes; set charge and spin explicitly and check the fairchem docs for the convention.</p>',
  solution:'w13d3',
  why:'<p>Always check element and chemistry coverage before trusting any ML potential. Outside its training domain it fails silently or loudly, never gracefully.</p>'},
 recall:[['What can MACE-OFF not do?','Represent metals: it covers only ten organic elements.'],['What do ML potentials give you over GAFF at a metal site, and what do they cost?','Near-DFT accuracy in the training domain and flexible coordination; the cost is much slower dynamics and failure outside the training data.'],['What must you set for UMA\'s omol task that classical force fields ignore?','Total charge and spin multiplicity of the system.']]});

day(13,4,{title:'ML for trajectories: a Markov state model from scratch',
 goal:'Build an MSM on a double-well trajectory, read its implied timescales, and know what the lag time does.',
 read:[['deeptime: documentation and examples','https://deeptime-ml.github.io/','30 min']],
 explore:[['deeptime on GitHub','https://github.com/deeptime-ml/deeptime']],
 sprint:{title:'Sprint: an MSM and implied timescales from scratch',tested:true,
  problem:'<p>Simulate overdamped Langevin dynamics in a double well, bin the position into 20 microstates, count transitions at several lag times, build the transition matrix and report implied timescales. Check that the slowest process stands well apart and the timescales are stable as the lag grows.</p>',
  hint:'<p>t_i = −τ / ln λ_i. Symmetrize the counts crudely to enforce detailed balance for this toy.</p>',
  solution:'w13d4',
  why:'<p>deeptime does the estimation properly (reversible estimators, validation tests). Writing this once shows you what its output means.</p>'},
 recall:[['What does an MSM give you that RMSD plots do not?','States, transition probabilities, implied timescales and populations.'],['What is the implied-timescales test?','Plot timescales against lag time. They should plateau; if they keep growing, the model is not Markovian at those lags.'],['What does VAMPnets add?','A neural network that learns the featurization that best separates slow processes.']]});

/* ===== PHASE 4: weeks 14-16 (capstone) ===== */

day(14,1,{title:'Receptor preparation from 6M0J',
 goal:'Isolate the spike receptor-binding domain, protonate it deliberately, and confirm your residue numbering matches the pocket residues in your plan.',
 read:[['RCSB entry 6M0J: chains, ligands, resolution','https://www.rcsb.org/structure/6M0J','15 min'],['AmberTools manuals (pdb4amber)','https://ambermd.org/Manuals.php','20 min']],
 explore:[['Your PhD repository (Stage 1 preparation and pocket residues)','https://github.com/ANest58/PhD'],['PROPKA for protonation guidance','https://github.com/jensengroup/propka']],
 sprint:{title:'Sprint: keep chain E, clean and protonate it',needs:'wget, awk and AmberTools (pdb4amber, reduce)',
  problem:'<p>Download 6M0J, keep only the protein atoms of the spike RBD (chain E), run pdb4amber to renumber and protonate, and report how many residues survive. Then check that residues 338, 339, 342, 343, 371 and 373 are where your plan says, and decide the protonation state of every histidine on purpose.</p>',
  hint:'<p>In PDB format the chain identifier is column 22. Decide explicitly what to do about glycans, waters and ions before deleting them.</p>',
  solution:'w14d1'},
 recall:[['Which chains in 6M0J are which?','Chain A is ACE2, chain E is the spike RBD.'],['Why decide histidine protonation yourself?','HID, HIE and HIP differ in charge and hydrogen bonding; the default may be wrong for the pocket.'],['What is lost when you delete glycans?','Possible steric and electrostatic effects near the surface. State it as a modelling choice.']]});

day(14,2,{title:'Ligand parameterization plan for ZnPc, CuPc and F16-ZnPc',
 goal:'Decide, per ligand, the charge model, multiplicity, QM level and failure modes, and write down what each conclusion can support.',
 read:[['MCPB.py tutorial (revisit the preparation section)','https://ambermd.org/tutorials/advanced/tutorial20/mcpbpy.php','25 min'],['Amber tutorials: force field and antechamber','https://ambermd.org/tutorials/ForceField.php','15 min']],
 explore:[['Your Stage 3 force-field gates (PR 12)','https://github.com/ANest58/PhD/pull/12'],['Deeth et al.: why Cu(II) needs d-electron effects','https://wrap.warwick.ac.uk/28222/']],
 sprint:{title:'Sprint: a parameterization decision log',
  problem:'<p>For each of ZnPc, CuPc and F16-ZnPc fill in: net charge of each residue, spin multiplicity, QM method, how the organic frame gets GAFF2 types (and what the fluorines do to them), what you expect to go wrong, and one sentence stating what claim the resulting model can and cannot support.</p>',
  hint:'<p>Write the CuPc entry last. If your honest claim for CuPc sounds weaker than for ZnPc, you have it right.</p>',
  solutionHtml:'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ligand</th><th>Charges and spin</th><th>Main risk</th><th>Claim the model supports</th></tr></thead><tbody>'+
   '<tr><td>ZnPc</td><td>Zn residue +2, Pc residue −2, singlet</td><td>Bond breaking in the QM small model; poor charges on the planar dianion</td><td>Stable planar N4 geometry in a bonded model; comparative interaction trends</td></tr>'+
   '<tr><td>CuPc</td><td>Cu +2, Pc −2, doublet (open shell)</td><td>Jahn-Teller and spin effects a fixed model cannot follow; QM convergence problems</td><td>Approximate geometry and electrostatics only; treat rankings against ZnPc as exploratory</td></tr>'+
   '<tr><td>F16-ZnPc</td><td>Zn +2, perfluorinated Pc −2, singlet</td><td>Fluorine atom types and charges on the periphery; strong quadrupole</td><td>As ZnPc, with extra attention to peripheral electrostatics</td></tr>'+
   '</tbody></table></div><p class="note-small">Your own Stage 3 gates in the PhD repository are the authority for what you actually did. This table is a thinking prompt.</p>'},
 recall:[['What must the CuPc entry say that the ZnPc entry need not?','That the metal is open shell, the QM multiplicity used, and that conclusions are approximate because the model cannot follow Jahn-Teller dynamics.'],['Why do fluorines need their own attention?','They change atom types and the charge distribution of the periphery; GAFF2 and charge fitting must be checked there.'],['What is the advantage of a parameterization log?','You can defend or revise each decision later, and a reviewer can see exactly what the model assumes.']]});

day(14,3,{title:'Poses: what docking can and cannot tell you',
 goal:'Define a pose quantitatively (centroid, plane tilt, distance to pocket) so poses can be compared, and hold an honest view of docking scores for metal complexes.',
 read:[['AutoDock Vina documentation','https://autodock-vina.readthedocs.io/','20 min'],['MolSSI: Python scripting for molecular docking (workshop on the resources page)','https://education.molssi.org/resources','20 min'],['PoseBusters: physical validity of docked poses','https://doi.org/10.1039/D3SC04185A','optional']],
 explore:[['Your Stage 4 docking poses (PR 14)','https://github.com/ANest58/PhD/pull/14'],['TeachOpenCADD docking talktorials','https://projects.volkamerlab.org/teachopencadd/']],
 sprint:{title:'Sprint: quantify a pose',tested:true,
  problem:'<p>Write a function that takes ligand coordinates and pocket C-alpha coordinates and returns the ligand centroid, ring-plane normal, distance to the pocket centroid, tilt between the plane normal and the line to the pocket, and a planarity ratio. Test it on a face-on and an edge-on synthetic macrocycle.</p>',
  hint:'<p>The plane normal is the singular vector with the smallest singular value of the centred ligand coordinates.</p>',
  solution:'w14d3',
  why:'<p>Docking scoring functions generally lack terms for metal coordination and open-shell effects, so treat docking as a source of hypotheses and let MD decide which poses survive.</p>'},
 recall:[['Why MD-rescore docked poses?','Docking scores are crude and lack metal-specific terms; MD tests stability with flexibility and explicit solvent.'],['What does the tilt angle tell you?','Whether the ring plane faces the pocket (0 degrees) or sits edge-on (90 degrees).'],['What is a risk of defining poses only by eye?','Two people will draw different boundaries; quantitative descriptors make comparisons reproducible.']]});

day(14,4,{title:'Integration: assemble and solvate every complex consistently',
 goal:'Write the tleap template, compute the right number of ions, and keep box and salt identical across ligands.',
 read:[['Your Stage 6 handoff: composition table (waters, ions, pad, ionic strength)','https://github.com/ANest58/PhD','15 min'],['AmberTools manuals (tleap: solvateOct, addIonsRand)','https://ambermd.org/Manuals.php','20 min']],
 sprint:{title:'Sprint: how many NaCl pairs for 150 mM, and a tleap template',tested:true,
  problem:'<p>Compute the number of NaCl pairs for 150 mM in a box with N waters and check it against your handoff (38 pairs for about 14,012 waters). Then fill in the tleap template for one complex and note where the metal-ligand bond commands from MCPB.py must go.</p>',
  hint:'<p>pairs = round(c × N_water / 55.5), where 55.5 mol/L is the molarity of pure water. Neutralize first, then add the pairs.</p>',
  solution:'w14d4',
  extra:fold('tleap template for one complex <span class="tag warn">Not run by me: needs AmberTools</span>',codeBlockHtml(CODE.w14d4b))},
 recall:[['How many NaCl pairs for 150 mM with 14,012 waters?','round(0.150 × 14012 / 55.5) = 38 pairs, on top of the neutralizing ions.'],['Why keep box and salt identical across ligands?','Differences in padding or ionic strength change energies and fluctuations and would contaminate a comparative ranking.'],['Why does the MCPB.py tleap file contain bond commands?','The metal-ligand bonds are defined explicitly in the topology; without them the bonded parameters are never used.']]});

day(15,1,{title:'Sizing the runs on real GPUs, then minimize and heat',
 goal:'Know in advance how long the capstone takes on your hardware, and start staged minimization and heating with restraints.',
 read:[['Amber GPU performance benchmarks','https://ambermd.org/GPUPerformance.php','15 min'],['Your Stage 6 handoff: job matrix and sizing table','https://github.com/ANest58/PhD','15 min']],
 explore:[['Stage 5 survival and throughput notes (PR 16)','https://github.com/ANest58/PhD/pull/16']],
 sprint:{title:'Sprint: wall-time and GPU-hour sizing from your own numbers',tested:true,
  problem:'<p>Using your measured throughput (about 239 ns/day on the RTX 3080 for the roughly 59,000-atom system) and the A100 estimates in the handoff, compute the wall time for 18 jobs of 100 ns on 1, 6 and 18 GPUs. What stays constant across those cases, and what changes?</p>',
  hint:'<p>waves = ceil(jobs / GPUs); wall time = waves × hours per job. Total GPU-hours is what you pay for.</p>',
  solution:'w15d1',
  why:'<p>Parallelism buys wall time, not cost. A smoke benchmark of 10 to 15 minutes before launching any fleet is cheaper than discovering a wrong estimate afterwards.</p>'},
 recall:[['Why can the same GPU-hours finish in 10 hours or 8 days?','Replicas are independent, so wall time is waves times hours per job while cost follows total GPU-hours.'],['What do you run before launching a fleet?','A short smoke benchmark on the real system and hardware.'],['Why restrain the solute during heating?','So the starting structure does not distort while temperature and solvent equilibrate.']]});

day(15,2,{title:'Equilibration checks at the metal site',
 goal:'Equilibrate NVT and NPT, and set up the analysis input that watches the four metal-nitrogen distances from the start.',
 read:[['cpptraj manual','https://amber-md.github.io/cpptraj/CPPTRAJ.xhtml','25 min']],
 explore:[['MDAnalysis user guide: distances and contacts','https://userguide.mdanalysis.org/stable/index.html']],
 sprint:{title:'Sprint: a cpptraj input for the core analyses',needs:'AmberTools (cpptraj)',
  problem:'<p>Write a cpptraj input that re-images the complex, computes protein backbone RMSD, ligand RMSD after protein alignment, per-residue RMSF, the four M-N distances, the ligand-pocket centre-of-mass distance, ligand SASA and native contacts. Replace the atom names with the real ones from your topology.</p>',
  hint:'<p>Print your topology atom names first (<code>parm ... ; atoms :ZPC</code> in cpptraj, or parmed) instead of guessing them.</p>',
  solution:'w15d2'},
 recall:[['What equilibration failure would specifically show up at the metal site?','A metal-nitrogen distance drifting from its QM value or the core losing planarity.'],['Why align on the protein but compute ligand RMSD without refitting?','So the number reports ligand motion relative to the pocket, not after the ligand has been superposed on itself.'],['Why are atom names a classic source of silent analysis errors?','A mask that matches nothing or the wrong atoms still runs; always print the matched atoms.']]});

day(15,3,{title:'The survival gate',
 goal:'Implement a pass/fail gate for short runs with thresholds fixed in advance, applied across all replicas.',
 read:[['Your Stage 5 survival report (PR 16)','https://github.com/ANest58/PhD/pull/16','15 min']],
 sprint:{title:'Sprint: a survival gate that needs every replica to pass',tested:true,
  problem:'<p>Write a gate that takes per-frame ligand RMSD, the maximum metal-nitrogen deviation and the ligand-pocket distance for one replica and returns the fraction of frames within thresholds and a pass/fail. A pose survives only if all replicas pass. Test it on a good pose and on a pose with one drifting replica.</p>',
  hint:'<p>Write the thresholds in the file header, with a comment saying where they came from, before you open any real results.</p>',
  solution:'w15d3',
  why:'<p>Moving thresholds after seeing data is p-hacking. The gate is cheap precisely because it is decided before the expensive runs.</p>'},
 recall:[['What is a survival gate?','A cheap pass/fail screen on short runs, applied before long production and MM/GBSA.'],['Why require every replica to pass?','A pose that survives in one replica and leaves in another is not a stable binding mode.'],['Why fix thresholds in advance?','Otherwise they can be tuned to the result you wanted.']]});

day(15,4,{title:'Integration: replica statistics with honest error bars',
 goal:'Summarize each observable across independent replicas, and see how much bigger the honest error is than a within-replica block error.',
 read:[['Grossfield et al.: uncertainty from multiple trajectories (free full text)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6286151','25 min']],
 sprint:{title:'Sprint: between-replica and within-replica errors',tested:true,
  problem:'<p>Simulate three replicas that settle in slightly different basins. For each compute the mean after dropping equilibration and a block standard error, then compute the standard error across replicas. Which one should you report, and why do they differ?</p>',
  hint:'<p>Between-replica SEM uses the three replica means as the samples, n = 3.</p>',
  solution:'w15d4',
  why:'<p>When replicas disagree beyond their within-run noise, the within-run error bar measures the wrong thing. Report the between-replica spread.</p>'},
 recall:[['Which error bar do you report for a replica-averaged quantity?','The spread between independent replicas.'],['Why can a block error be misleadingly small?','It only measures noise within one basin; it cannot see that other replicas settled elsewhere.'],['What does n = 3 imply for confidence?','Very little: an error bar from three numbers is itself uncertain, so be conservative.']]});

day(15,5,{kind:'learn',title:'Comparative MM/GBSA ranking, with ties called ties',
 goal:'Run the same MM/GBSA protocol for every ligand and state which differences are real.',
 read:[['Genheden and Ryde: the MM/PBSA and MM/GBSA methods (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4487606','30 min'],['Amber MMPBSA.py tutorial','https://ambermd.org/tutorials/advanced/tutorial3/','20 min']],
 explore:[['Hou et al.: assessing the performance of MM/PBSA and MM/GBSA (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC3029230']],
 sprint:{title:'Sprint: rank with errors, and call ties ties',tested:true,
  problem:'<p>Given per-replica MM/GBSA values for three ligands (synthetic here), compute means with standard errors, then compare ligand pairs with a Welch test and a two-standard-error rule. Report which comparisons are distinguishable and which are ties. Then write the single sentence you would put in a paper, and the sentence you must not.</p>',
  hint:'<p>With three replicas per ligand, a difference under about two standard errors of the difference is a tie.</p>',
  solution:'w15d5',
  extra:fold('MMPBSA.py input template <span class="tag warn">Not run by me: needs AmberTools</span>',codeBlockHtml(CODE.w15d5b)),
  why:'<p>Sentence you can write: "Under one protocol, ligand A ranks above ligand B, with a difference of x ± y kcal/mol (three replicas)." Sentence you must not write: any absolute binding free energy.</p>'},
 recall:[['What does MM/GBSA leave out?','Conformational entropy and binding-site water thermodynamics, among other approximations.'],['When do you call two ligands different with three replicas?','When the difference exceeds about two standard errors of the difference and survives your protocol checks.'],['Why use the same protocol for every ligand?','Systematic errors then cancel in the comparison; mixing protocols removes that benefit.']]});

day(16,1,{title:'The per-pose feature table, ready for Dataiku',
 goal:'Collapse every trajectory analysis into one row per pose and replica, and keep track of what the independent unit is.',
 read:[['Dataiku docs: Experiment Tracking and the Flow','https://doc.dataiku.com/dss/latest/mlops/experiment-tracking/index.html','20 min'],['Dataiku Academy (free courses)','https://academy.dataiku.com/','optional']],
 sprint:{title:'Sprint: build the table and write it for Dataiku',tested:true,
  problem:'<p>Build one row per (pose, replica) with ligand RMSD statistics, the fraction of frames below a threshold, M-N distance statistics, contacts and SASA, plus a survived flag. Save it as CSV for a Dataiku dataset and note which column is the real grouping unit for validation.</p>',
  solution:'w16d1',
  why:'<p>The three replicas of a pose are not independent rows. The pose is the unit; any split must group by it.</p>'},
 recall:[['What is the independent unit in your dataset?','The pose; replicas of the same pose are not independent.'],['Why export CSV for Dataiku?','It makes the table a versioned dataset in the Flow that recipes, models and dashboards can all use.'],['What would you add if you had more compute?','More replicas per pose, and per-frame MM/GBSA terms as features.']]});

day(16,2,{title:'A small ML layer, and what 18 rows can never show',
 goal:'Learn, from simulation, how often noise looks predictive when there are only six groups.',
 read:[['scikit-learn: cross-validation and group splitters','https://scikit-learn.org/stable/modules/cross_validation.html','20 min']],
 sprint:{title:'Sprint: leave-one-pose-out R² on noise-only datasets',tested:true,
  problem:'<p>Generate 300 datasets in which features and target are unrelated, evaluate leave-one-pose-out R² on each, and report the distribution. How often does pure noise look predictive? What does that say about any single grouped R² from your real capstone?</p>',
  solution:'w16d2',
  why:'<p>Always compare with a null distribution. A single good-looking number from six groups is not evidence.</p>'},
 recall:[['Why is the 18-row dataset too small for inference?','It holds six independent poses, so grouped CV is unstable and noise can look predictive.'],['What is a null distribution for?','To tell whether your score is distinguishable from what chance alone produces.'],['What is a sensible use of ML on this dataset?','Practice leakage-free method, generate hypotheses, not claims.']]});

day(16,3,{title:'Co-folding and affinity models: what to conclude',
 goal:'Know what Boltz-style models offer and what a number from one can never mean for a metallophthalocyanine.',
 read:[['Boltz repository (open-source co-folding and affinity models)','https://github.com/jwohlwend/boltz','20 min'],['PoseBusters: physical validity of AI docking','https://doi.org/10.1039/D3SC04185A','20 min'],['Have protein-ligand co-folding methods moved beyond memorisation?','https://www.researchgate.net/publication/388828996_Have_protein-ligand_co-folding_methods_moved_beyond_memorisation','optional']],
 sprint:{title:'Sprint: write what you would and would not conclude',
  problem:'<p>Suppose a co-folding model returns a pose and an affinity score for ZnPc on the RBD. Write three conclusions you would allow yourself and three you would not, with the reason for each, and the check that would let you upgrade a forbidden conclusion.</p>',
  solutionHtml:'<p><b>Allowed.</b> (1) A candidate pose worth testing in MD. (2) A rough hint about which pocket is plausible. (3) A prompt to compare with docking poses for consistency.</p><p><b>Not allowed.</b> (1) That the affinity ranks your ligands: training data and metal handling are limited. (2) That the pose is physically valid without a validity check and MD. (3) That any result transfers to CuPc or F16-ZnPc.</p><p><b>Upgrade path.</b> A pose becomes a finding only after it survives your gate and replicas; an affinity becomes a ranking only after it agrees with an independent method on ligands where the answer is known.</p>'},
 recall:[['What would you not conclude from a Boltz-2 affinity number for a metallophthalocyanine?','That it ranks your complexes; treat it as a weak prior at best.'],['What do benchmarks say about co-folding and memorization?','Performance drops on novel ligands and pockets, so physical-validity checks matter.'],['What is the right role of such a model in your pipeline?','A hypothesis generator upstream of MD, never a replacement for it.']]});

day(16,4,{title:'Using LLMs and agents without outsourcing the understanding',
 goal:'Build the reflex that every generated analysis snippet gets a test that fails on a planted bug.',
 read:[['Best Practices for Scientific Computing (Wilson et al.)','https://doi.org/10.1371/journal.pbio.1001745','25 min']],
 sprint:{title:'Sprint: a test that catches a planted bug',tested:true,
  problem:'<p>Here is a plausible RMSD helper that forgets to centre the coordinates. Write tests that pass for the correct version and fail for the buggy one, including a pure-translation test. Then write your own personal rule for when an LLM answer is trust-but-verify and when you do it yourself.</p>',
  solution:'w16d4',
  why:'<p>Good rules: use LLMs for boilerplate and explanation; never for physics, units or numbers you cannot check; always run a from-scratch comparison on a tiny case; read every line that touches a unit.</p>'},
 recall:[['What is your rule for trusting LLM-written analysis code?','Never unverified: write a test that fails on a planted bug, compare with a from-scratch version, read every line touching physics or units.'],['What kind of bug is hardest to catch by reading?','A plausible but wrong formula, a units mismatch, or an off-by-one in indexing.'],['What belongs in a unit test for a scientific function?','Known answers, invariances (translation, rotation, symmetry), and edge cases.']]});

const PB=[
 {n:1,level:1,title:'Mean and sample standard deviation, no NumPy',pair:'w1d5',code:'pb01',
  statement:'<p>Write <code>mean_std(xs)</code> returning the mean and the <i>sample</i> standard deviation (divide by n − 1) of a list, without NumPy. Raise <code>ValueError</code> when there are fewer than two values. Check against NumPy with <code>ddof=1</code>.</p>',
  hint:'<p>Sum, divide, sum the squared deviations, divide by n − 1, square root.</p>',
  note:'<p>Why n − 1: the sample mean already used one degree of freedom, so dividing by n underestimates the variance.</p>'},
 {n:2,level:1,title:'Parse a chemical formula, with tests written first',pair:'w1d5',code:'pb02',
  statement:'<p>Write <code>parse_formula("C6H12O6")</code> returning <code>{"C": 6, "H": 12, "O": 6}</code>. Handle one level of parentheses (<code>Ca(OH)2</code>) and reject malformed input (empty string, lowercase element, stray symbols). Write the tests before the function.</p>',
  hint:'<p>A regular expression with an optional integer after each element symbol; recurse on the parenthesized group.</p>',
  note:'<p>The metal complex <code>ZnC32H16N8</code> is in the tests: it is ZnPc.</p>'},
 {n:3,level:1,title:'A Particle dataclass',pair:'w1d5',code:'pb03',
  statement:'<p>Write a <code>Particle</code> dataclass with mass, position and velocity (3-vectors, default zeros), a <code>kinetic_energy()</code> method and a <code>momentum()</code> method. Make sure two particles never share the same default array.</p>',
  hint:'<p>Use <code>field(default_factory=...)</code> for mutable defaults.</p>',
  note:'<p>A default of <code>np.zeros(3)</code> written directly would be one shared array: the classic mutable-default bug.</p>'},
 {n:4,level:2,title:'A lazy multi-frame XYZ reader',pair:'w1d5',code:'pb04',
  statement:'<p>Write a generator <code>read_xyz_frames(fh)</code> that yields <code>(comment, symbols, coords)</code> for each frame of a multi-frame XYZ file, one frame at a time, without loading the file. Test it on an in-memory file.</p>',
  hint:'<p>Read the atom count, then the comment line, then that many atom lines. Stop on an empty line.</p>',
  note:'<p>Laziness matters: a real trajectory does not fit in memory as text.</p>'},
 {n:5,level:2,title:'Pairwise distances in a periodic box',pair:'w1d5',code:'pb05',
  statement:'<p>Write <code>pbc_distance_matrix(x, box)</code> for positions (N,3) in an orthorhombic periodic box. Use the minimum-image convention and no loops. Test two atoms that are close only through the boundary.</p>',
  hint:'<p><code>d -= box * np.round(d / box)</code>.</p>',
  note:'<p>No distance can exceed half the box diagonal. That is a free test.</p>'},
 {n:6,level:2,title:'A 3-D radial distribution function, validated',pair:'w2d5',code:'pb06',
  statement:'<p>Write <code>rdf3d(x, box)</code> for N points in a cubic periodic box. Validate it on uniformly random points: an ideal gas must give g(r) close to 1 everywhere.</p>',
  hint:'<p>Histogram the pair distances and divide by the ideal-gas count in each shell: N·ρ·(4/3)π(r₂³ − r₁³)/2 for unordered pairs.</p>',
  note:'<p>Validating on a case with a known answer is how you trust the function before pointing it at a real trajectory.</p>'},
 {n:7,level:2,title:'Replica means and the honest standard error',pair:'w2d5',code:'pb07',
  statement:'<p>Given a long DataFrame with columns <code>replica, frame, rmsd</code>, drop the first 20 percent of frames, compute one mean per replica, then the mean and standard error across replicas. Compare with the naive standard error that treats every frame as independent.</p>',
  hint:'<p><code>groupby("replica")["rmsd"].mean()</code>, then <code>std(ddof=1)/sqrt(n)</code> on those three numbers.</p>',
  note:'<p>The honest error comes from n = 3 replicas, not from n = 480 correlated frames.</p>'},
 {n:8,level:2,title:'A figure with replicas and a mean plus standard error band',pair:'w2d5',code:'pb08',
  statement:'<p>Plot three replica time series faintly, their mean as a solid line, and a shaded band for the standard error across replicas. Label axes with units and save the figure.</p>',
  hint:'<p><code>ax.fill_between(t, mean - sem, mean + sem, alpha=0.15)</code>.</p>',
  note:'<p>Showing every replica, not just the mean, is the honest way to show a small n.</p>'},
 {n:9,level:2,title:'Centre of mass, radius of gyration and inertia tensor',pair:'w2d5',code:'pb09',
  statement:'<p>For a water molecule given as masses and coordinates, compute the centre of mass, the radius of gyration, the inertia tensor, and its principal moments and axes. Add checks: the centred coordinates have zero mass-weighted sum, and the trace of the tensor equals twice the sum of m·r².</p>',
  hint:'<p>I = Σ m (r² 1 − r rᵀ), about the centre of mass. Diagonalize with <code>eigh</code>.</p>',
  note:'<p>For a planar molecule the largest principal axis is perpendicular to the plane.</p>'},
 {n:10,level:2,title:'Lennard-Jones force, checked numerically',pair:'w2d1',code:'w2d1',
  statement:'<p>Implement the Lennard-Jones potential and force in reduced units and verify F = −dV/dr numerically at several distances. Show that the force vanishes at r = 2^(1/6).</p>',
  hint:'<p>V = 4(r⁻¹² − r⁻⁶), F = 24(2r⁻¹³ − r⁻⁷).</p>',
  note:'<p>The reference file is the full week 2 day 1 sprint, which also includes a gradient-descent check.</p>'},
 {n:11,level:3,title:'Explicit Euler against velocity Verlet',pair:'w2d4',code:'pb11',
  statement:'<p>Integrate a harmonic oscillator with explicit Euler and with velocity Verlet at the same step size and compare how the energy behaves over 4,000 steps. Then show that halving the step reduces the position error of velocity Verlet by about four.</p>',
  hint:'<p>Verlet: half-kick, drift, half-kick. Compare with the exact solution x(t) = cos t.</p>',
  note:'<p>Euler gains energy without limit; Verlet\'s energy error stays bounded. Second-order accuracy shows as a ratio of 4.</p>'},
 {n:12,level:3,title:'Autocorrelation and integrated autocorrelation time',pair:'w3d3',code:'w3d3',
  statement:'<p>Write the autocorrelation function and an integrated-autocorrelation-time estimator with a sensible window. Test on an AR(1) signal where the exact answer is known.</p>',
  hint:'<p>τ = 1/2 + Σ ρ(k), stopped once k exceeds a few times τ.</p>',
  note:'<p>The reference is the week 3 day 3 sprint.</p>'},
 {n:13,level:3,title:'Block averaging and the plateau',pair:'w3d4',code:'w3d4',
  statement:'<p>Write a block-averaging standard-error function and show that the error rises with block size and plateaus at the value predicted from τ.</p>',
  hint:'<p>Reshape to (blocks, size), average, std/√blocks.</p>',
  note:'<p>The reference is the week 3 day 4 sprint.</p>'},
 {n:14,level:3,title:'Kabsch superposition and RMSD',pair:'w6d2',code:'w6d2',
  statement:'<p>Implement the Kabsch algorithm with an SVD, including the reflection guard, and test it on a randomly rotated, translated and slightly noisy copy of a structure.</p>',
  hint:'<p>The sign of det(V Uᵀ) decides whether the last axis needs flipping.</p>',
  note:'<p>The reference is the week 6 day 2 sprint.</p>'},
 {n:15,level:3,title:'Convolution, transposed convolution and the adjoint identity',pair:'w2d3',code:'w2d3',
  statement:'<p>Write a 1-D valid convolution, its matrix form, and a transposed convolution; prove ⟨conv(x), z⟩ = ⟨x, convT(z)⟩ and that convT is not an inverse.</p>',
  hint:'<p>Each row of the convolution matrix is the kernel shifted by one.</p>',
  note:'<p>The reference is the week 2 day 3 sprint.</p>'},
 {n:16,level:3,title:'A 2-D Lennard-Jones molecular dynamics simulation',pair:'w2d4',code:'w2d4',
  statement:'<p>Write a class-based 2-D Lennard-Jones MD with periodic boundaries and velocity Verlet, run it for a few thousand steps, monitor the energy, compute an RDF and write an XYZ file.</p>',
  hint:'<p>Remove centre-of-mass drift from the initial velocities and rescale to the target temperature.</p>',
  note:'<p>The reference is the week 2 day 4 sprint.</p>'},
 {n:17,level:2,title:'Maxwell-Boltzmann velocities and a temperature rescale',pair:'w2d4',code:'pb17',
  statement:'<p>Draw velocities from the Maxwell-Boltzmann distribution for N atoms at 300 K, remove centre-of-mass motion, compute the instantaneous temperature from the kinetic energy (with 3N − 3 degrees of freedom), then rescale to hit the target exactly. Check the mean speed against the analytic value.</p>',
  hint:'<p>Each Cartesian component is Normal(0, √(kT/m)). KE = ½ N_dof k T.</p>',
  note:'<p>A hard rescale like this is only for initialization. It is not a thermostat for production.</p>'}
];

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}};
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const KEYRE=/^[A-Za-z0-9._-]{1,64}$/;
const strip=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();

const TASKSETS={
  learn:[['t','Read and watch','35 min'],['s','Code sprint','60 min'],['r','Active recall','15 min'],['j','Notes and journal','10 min']],
  check:[['q','Closed-book quiz','25 min'],['f','Fix every miss','30 min'],['s','Rebuild one sprint from memory','45 min'],['j','Notes and journal','20 min']],
  teach:[['w','Write the explanation without notes','40 min'],['v','Say it aloud or record it','30 min'],['g','Turn each gap into a card','30 min'],['j','Notes and journal','20 min']],
  light:[['a','Anki reviews','15 min'],['p','Read one abstract','15 min'],['j','One-line journal','5 min']],
  project:[['b','Build the deliverable','75 min'],['d','Write the README','30 min'],['c','Commit and tag it','5 min'],['j','Notes and journal','10 min']]
};
const KIND_LABEL={learn:'Learn',check:'Checkpoint',teach:'Teach-back',light:'Light day',project:'Project'};

/* ================= finalize data ================= */
const ORDER=[];
function finalize(){
  for(let n=1;n<=16;n++){
    const wk=WEEKS[n]; if(!wk) throw new Error('missing week '+n);
    for(let d=1;d<=7;d++){
      const id='w'+n+'d'+d;
      if(!DAYS[id]){
        if(d===5) DAYS[id]={id,w:n,d,kind:'check',title:'Checkpoint: '+wk.short,goal:'Closed-book quiz. Score yourself, then fix every miss.',problems:wk.problems};
        else if(d===6&&wk.project) DAYS[id]={id,w:n,d,kind:'project',title:wk.project.title,goal:wk.project.goal};
        else if(d===6) DAYS[id]={id,w:n,d,kind:'teach',title:'Teach-back: '+wk.short,goal:'Explain the week without notes. The gaps you find become your next cards.'};
        else if(d===7) DAYS[id]={id,w:n,d,kind:'light',title:'Light day',goal:'Anki reviews and one abstract. Protect the retention you built this week.'};
        else throw new Error('missing '+id);
      }
      const day=DAYS[id];
      day.kind=day.kind||(d<=4?'learn':d===5?'check':d===6?'teach':'light');
      day.taskKeys=TASKSETS[day.kind].map(t=>t[0]);
      day.frac=0;
      ORDER.push(id);
    }
  }
}

/* ================= state ================= */
const LS='mdai-workbook-v1';
const state={checks:Object.create(null),notes:Object.create(null),meta:Object.create(null)};
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS); if(!raw) return;
    const o=JSON.parse(raw);
    ['checks','notes','meta'].forEach(m=>{
      const src=o[m]||{};
      Object.keys(src).forEach(k=>{ const e=src[k]; if(KEYRE.test(k)&&e&&typeof e==='object'&&'t' in e) state[m][k]={v:e.v,t:+e.t||0}; });
    });
  }catch(e){}
}
let lsTimer=0;
function saveLocalSoon(){ clearTimeout(lsTimer); lsTimer=setTimeout(()=>{ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){} },250); }
const isChecked=k=>{const c=state.checks[k]; return !!(c&&c.v);};
const noteVal=k=>{const n=state.notes[k]; return n&&n.v!=null?String(n.v):'';};

/* ================= sync (private per-person storage, local fallback) ================= */
let col=null, flushTimer=0, flushing=false, firstSnap=true, syncMode='loading';
const dirty=new Set(); const remoteT=Object.create(null);
const enc=k=>k.replace(/\./g,'__'), dec=k=>k.replace(/__/g,'.');
function noteDoc(key){
  const m=/^w(\d+)d/.exec(key); if(m) return 'n-w'+String(m[1]).padStart(2,'0');
  if(key.indexOf('g.')===0) return 'n-g-'+key.slice(2).replace(/[^A-Za-z0-9-]/g,'');
  if(key.indexOf('p.')===0) return 'n-p';
  return 'n-misc';
}
function encMap(m){ return Object.fromEntries(Object.keys(m).map(k=>[enc(k),{v:m[k].v,t:m[k].t}])); }
function buildDoc(id){
  if(id==='progress') return {checks:encMap(state.checks),meta:encMap(state.meta)};
  const sub=Object.create(null);
  Object.keys(state.notes).forEach(k=>{ if(noteDoc(k)===id) sub[k]=state.notes[k]; });
  return {notes:encMap(sub)};
}
function setSync(mode,msg){
  syncMode=mode;
  const chip=$('#syncChip'); if(!chip) return;
  const labels={loading:'Loading',local:'Saved on this device',syncing:'Saving',saved:'Saved to your account',error:'Kept on this device only'};
  chip.dataset.s=mode; chip.textContent=msg||labels[mode]||mode;
  chip.title=mode==='local'?'Your notes and progress are stored in this browser only. Use Backup and export to move them to another device.':
             mode==='saved'?'Notes and progress are saved to your account and also cached on this device.':'';
}
function afterChange(docId){ saveLocalSoon(); dirty.add(docId); scheduleFlush(); }
function scheduleFlush(){
  if(!col){ dirty.clear(); if(syncMode!=='local') setSync('local'); return; }
  setSync('syncing'); clearTimeout(flushTimer); flushTimer=setTimeout(flush,900);
}
async function flush(){
  if(!col) return;
  if(flushing){ flushTimer=setTimeout(flush,400); return; }
  flushing=true;
  try{
    while(dirty.size){
      const id=dirty.values().next().value;
      await col.doc(id).set(buildDoc(id));
      dirty.delete(id);
    }
    setSync('saved');
  }catch(e){
    console.warn('sync failed',e);
    setSync('error','Couldn\u2019t reach your account. Kept on this device.');
    setTimeout(()=>{ if(dirty.size) scheduleFlush(); },15000);
  }finally{ flushing=false; }
}
function mergeMap(kind,remote,changed){
  if(!remote||typeof remote!=='object') return;
  Object.keys(remote).forEach(rk=>{
    const k=dec(rk); if(!KEYRE.test(k)) return;
    const r=remote[rk]; if(!r||typeof r!=='object') return;
    const rt=+r.t||0, rkey=kind+':'+k;
    remoteT[rkey]=Math.max(remoteT[rkey]||0,rt);
    const l=state[kind][k];
    if(!l||rt>l.t){ state[kind][k]={v:r.v,t:rt}; changed[kind].add(k); }
  });
}
function onSnap(snap){
  const changed={checks:new Set(),notes:new Set(),meta:new Set()};
  snap.docs.forEach(d=>{
    const data=d.data(); if(!data) return;
    if(d.id==='progress'){ mergeMap('checks',data.checks,changed); mergeMap('meta',data.meta,changed); }
    else if(d.id.indexOf('n-')===0){ mergeMap('notes',data.notes,changed); }
  });
  const definitive=!(snap.metadata&&snap.metadata.fromCache);
  if(firstSnap&&definitive){
    firstSnap=false;
    ['checks','notes','meta'].forEach(m=>Object.keys(state[m]).forEach(k=>{
      if(state[m][k].t>(remoteT[m+':'+k]||0)) dirty.add(m==='notes'?noteDoc(k):'progress');
    }));
    if(dirty.size) scheduleFlush(); else setSync('saved');
  }else if(!dirty.size&&!flushing&&definitive){ setSync('saved'); }
  changed.checks.forEach(syncCheckbox); changed.notes.forEach(syncNote);
  if(changed.checks.size) updateProgress();
  if(changed.meta.size) renderNextUp();
  saveLocalSoon();
}
async function initSync(){
  setSync('local');
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const dbNs=res[0], userNs=res[1];
    if(!dbNs||!userNs) return;
    const uid=await userNs.id();
    if(!uid) return;
    col=dbNs.collection('data/users/'+uid);
    setSync('syncing','Syncing');
    col.onSnapshot(onSnap,err=>{ console.warn('snapshot error',err); col=null; setSync('error','Couldn\u2019t reach your account. Kept on this device.'); });
  }catch(e){ console.warn(e); col=null; setSync('local'); }
}

/* ================= setters ================= */
const now=()=>Date.now();
function setCheck(key,val){ state.checks[key]={v:val?1:0,t:now()}; afterChange('progress'); syncCheckbox(key); updateProgress(); }
function setNote(key,text){ state.notes[key]={v:text,t:now()}; afterChange(noteDoc(key)); }
function setMeta(key,val){ state.meta[key]={v:val,t:now()}; afterChange('progress'); }
function syncCheckbox(k){
  $$('input[data-ck="'+k+'"]').forEach(cb=>{ cb.checked=isChecked(k); const t=cb.closest('.task'); if(t) t.classList.toggle('done',cb.checked); });
}
function syncNote(k){
  $$('[data-note="'+k+'"]').forEach(el=>{ if(document.activeElement!==el) el.value=noteVal(k); });
}
function refreshAllInputs(){
  $$('input[data-ck]').forEach(cb=>syncCheckbox(cb.dataset.ck));
  $$('[data-note]').forEach(el=>{ if(document.activeElement!==el) el.value=noteVal(el.dataset.note); });
}

/* ================= smart punctuation for authored text ================= */
const typo=t=>String(t)
  .replace(/(^|[\s(\[{\u2014\u2013-])"/g,'$1\u201C').replace(/"/g,'\u201D')
  .replace(/(^|[\s(\[{\u2014\u2013-])'/g,'$1\u2018').replace(/'/g,'\u2019');
function smartQuotes(root){
  const skip=new Set(['CODE','PRE','TEXTAREA','SCRIPT','STYLE','INPUT','KBD','SAMP']);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!/['"]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
    for(let p=n.parentNode;p&&p!==root;p=p.parentNode){ if(skip.has(p.nodeName)) return NodeFilter.FILTER_REJECT; }
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{ n.nodeValue=typo(n.nodeValue); });
}

/* ================= html builders ================= */
function linkItem(it){
  const label=it[0], url=it[1], mins=it[2];
  const h=hostOf(url); const shown=/(^|\.)youtube\.com$|^youtu\.be$/.test(h)?'YouTube':h;
  return '<li><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>'+(mins?'<span class="mins">'+esc(mins)+'</span>':'')+'<span class="host">'+esc(shown)+'</span></li>';
}
const linkList=a=>'<ul class="reads">'+a.map(linkItem).join('')+'</ul>';
const fold=(title,body,open)=>'<details class="fold"'+(open?' open':'')+'><summary>'+title+'</summary><div class="fold-body">'+body+'</div></details>';
const codeBlock=c=>'<div class="codewrap"><button class="copy" type="button" aria-label="Copy code">Copy</button><pre><code>'+esc(String(c).replace(/\s+$/,''))+'</code></pre></div>';
const qa=(q,a)=>'<details class="qa"><summary>'+q+'</summary><div class="ans">'+a+'</div></details>';
function task(day,key,name,min,body){
  const id=day.id+'.'+key;
  return '<section class="task" data-task="'+id+'"><label class="task-head"><input type="checkbox" data-ck="'+id+'"><span class="t-name">'+esc(name)+'</span><span class="t-min">'+esc(min)+'</span></label><div class="task-body">'+body+'</div></section>';
}
function testTag(s){
  if(s.tested) return '<span class="tag ok">Reference code run and passing</span>';
  if(s.needs) return '<span class="tag warn">Not run by me: needs '+esc(s.needs)+'</span>';
  return '';
}
function sprintHtml(s){
  if(!s) return '<p class="note-small">No code today. The work is in the reading and the recall questions.</p>';
  let h='<div class="sub">'+esc(s.title||'Code sprint')+' '+testTag(s)+'</div><div class="problem">'+s.problem+'</div>';
  if(s.hint) h+=fold('Hint',s.hint);
  if(s.starter) h+=fold('Starter code',codeBlock(s.starter));
  const sol=(s.solutionHtml||'')+(s.solution?codeBlock(CODE[s.solution]!=null?CODE[s.solution]:s.solution):'')+(s.why?'<div class="why">'+s.why+'</div>':'');
  if(sol) h+=fold('Reference solution (try first)',sol);
  if(s.extra) h+=s.extra;
  return h;
}
function notesBox(day,prompt){
  return '<div class="notes-wrap"><div class="notes-label"><span><b>My notes</b> for week '+day.w+', day '+day.d+'</span><span class="saved" data-saved="'+day.id+'"></span></div>'+
    (prompt?'<p class="prompt">'+prompt+'</p>':'')+
    '<textarea class="notes" rows="7" data-note="'+day.id+'" spellcheck="true" placeholder="Write in your own words: what clicked, what did not, the bug you hit and how you fixed it."></textarea></div>';
}
const JOURNAL='Three lines: one thing you can now do without looking, one thing still fuzzy, one error for the log.';
function problemLinks(list){
  if(!list||!list.length) return '';
  return '<div class="sub">Problem-bank items for today</div><ul class="reads">'+list.map(n=>{
    const p=PB.find(x=>x.n===n); return '<li><a href="#pb-'+n+'" data-goto="pb-'+n+'">Problem '+n+': '+esc(p?p.title:'')+'</a></li>';
  }).join('')+'</ul>';
}
function dayBody(day){
  const wk=WEEKS[day.w], k=day.kind, T=TASKSETS[k];
  const tk=(i,body)=>task(day,T[i][0],T[i][1],T[i][2],body);
  let out='';
  if(k==='learn'){
    let rd='';
    if(day.read&&day.read.length) rd+='<div class="sub">Reading targets</div>'+linkList(day.read);
    if(day.watch&&day.watch.length) rd+='<div class="sub">Watch</div>'+linkList(day.watch);
    if(day.explore&&day.explore.length) rd+='<div class="sub">Explore on GitHub and elsewhere</div>'+linkList(day.explore);
    out+=tk(0,rd||'<p class="note-small">Use the course map to pick a resource for this topic.</p>');
    out+=tk(1,sprintHtml(day.sprint));
    out+=tk(2,'<p class="prompt">Answer each question aloud or on paper first. Then open the answer.</p>'+(day.recall||[]).map(x=>qa(x[0],x[1])).join(''));
    out+=tk(3,notesBox(day,JOURNAL));
  }else if(k==='check'){
    const quiz=wk.quiz||[];
    out+=tk(0,'<p class="prompt">Closed book. Write each answer before you open it.</p>'+quiz.map(x=>qa(x[0],x[1])).join('')+
      '<div class="score"><label>Score <input type="number" min="0" max="'+quiz.length+'" data-note="'+day.id+'.score" aria-label="Quiz score"></label><span>of '+quiz.length+'.</span><span class="note-small">Below 80 percent? Those items are the agenda for day 6.</span></div>'+problemLinks(day.problems)+(day.afterQuiz||''));
    out+=tk(1,'<p>For every miss: one Anki card in your own words, and one line in the <a href="#sec-notebook" data-goto="sec-notebook">error log</a> naming the mistake behind it (not just the right answer).</p>');
    const wkDays=[1,2,3,4].map(d=>DAYS['w'+day.w+'d'+d]);

let searchIndex=[];
function buildSearchIndex(){
  ORDER.forEach(id=>{
    const d=DAYS[id], wk=WEEKS[d.w];
    const text=[d.title,d.goal,wk.title,(d.read||[]).map(x=>x[0]).join(' '),(d.watch||[]).map(x=>x[0]).join(' '),(d.explore||[]).map(x=>x[0]).join(' '),d.sprint?strip(d.sprint.title+' '+d.sprint.problem):'',(d.recall||[]).map(x=>strip(x[0])).join(' ')].join(' ');
    searchIndex.push({id,title:'W'+d.w+' D'+d.d+': '+d.title,sub:strip(d.goal||'')||wk.title,text:text.toLowerCase()});
  });
  for(let n=1;n<=16;n++){ const w=WEEKS[n]; searchIndex.push({id:'week-'+n,title:'Week '+n+': '+w.title,sub:strip(w.focus),text:(w.title+' '+strip(w.focus)+' '+strip(w.deliverable)).toLowerCase()}); }
  PB.forEach(p=>searchIndex.push({id:'pb-'+p.n,title:'Problem '+p.n+': '+p.title,sub:'Python and math review starter',text:(p.title+' '+strip(p.statement)).toLowerCase()}));
  RES.forEach(g=>g.items.forEach(it=>searchIndex.push({id:it.id,title:it.t,sub:g.title+' ('+it.kind+')',text:(it.t+' '+g.title+' '+it.kind+' '+strip(it.note)).toLowerCase()})));
}
function runSearch(q){
  const box=$('#searchResults'); q=q.trim().toLowerCase();
  if(!q){ box.innerHTML='<p class="note-small" style="padding:.4rem .6rem">Try: Seminario, einsum, MM/GBSA, OpenMM, MACE, block averaging.</p>'; return; }
  const toks=q.split(/\s+/);
  const hits=searchIndex.map(e=>{ let s=0; for(const t of toks){ if(e.title.toLowerCase().includes(t)) s+=3; else if(e.text.includes(t)) s+=1; else return null; } return [s,e]; }).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,30);
  box.innerHTML=hits.length?hits.map(h=>'<a href="#'+h[1].id+'" data-goto="'+h[1].id+'" role="option">'+esc(h[1].title)+'<small>'+esc(h[1].sub.slice(0,120))+'</small></a>').join(''):'<p class="note-small" style="padding:.4rem .6rem">Nothing matches that. Try fewer or simpler words.</p>';
  smartQuotes(box);
}

    if(note||score||n){ out+='## Week '+d.w+', day '+d.d+': '+d.title+'\n\nTasks ticked: '+n+' of '+d.taskKeys.length+(score?'. Quiz score: '+score:'')+'\n\n'+(note||'(no notes)')+'\n\n'; }

function openExport(title,text){ $('#exportTitle').textContent='Copy '+title; $('#exportBox').value=text; $('#exportModal').hidden=false; const b=$('#exportBox'); b.focus(); b.select(); }
function browserDownload(filename,data){
  const type=/\.json$/.test(filename)?'application/json':'text/markdown';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function saveFile(filename,data){
  const framed=!!(window.claude&&typeof window.claude.use==='function');
  if(framed){
    try{
      const dl=await window.claude.use('downloads');
      if(dl){ await dl.save({filename,data}); return; }
    }catch(e){ if(e&&e.code==='declined') return; console.warn(e); }
    openExport(filename,data); return;
  }
  try{ browserDownload(filename,data); }catch(e){ console.warn(e); openExport(filename,data); }
}
function importJSON(text){

  if(!o||o.app!=='mdai-workbook') return 'That file does not look like a workbook backup.';
  let n=0;
  ['checks','notes','meta'].forEach(m=>{
    const src=o[m]; if(!src||typeof src!=='object') return;
    Object.keys(src).forEach(k=>{
      if(!KEYRE.test(k)) return; const e=src[k]; if(!e||typeof e!=='object') return;
      const t=+e.t||0, l=state[m][k];
      if(!l||t>l.t){ state[m][k]={v:e.v,t}; n++; dirty.add(m==='notes'?noteDoc(k):'progress'); }
    });
  });
  saveLocalSoon(); scheduleFlush(); refreshAllInputs(); updateProgress();
  return 'Restored '+n+' item'+(n===1?'':'s')+' (anything newer on this device was kept).';
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e2){ return false; } }
}

/* ================= theme ================= */
let theme='auto'; try{ theme=localStorage.getItem('mdai-theme')||'auto'; }catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(theme==='light'||theme==='dark') r.setAttribute('data-theme',theme); else r.removeAttribute('data-theme');
  const b=$('#themeBtn'); if(b){ b.title='Colour theme: '+theme; b.setAttribute('aria-label','Colour theme: '+theme+'. Click to change.'); }
}

/* ================= boot ================= */
function render(){
  const main=$('#content');
  const start=
    '<div class="hero"><h1>Molecular dynamics and machine learning: a 16-week workbook</h1>'+
    '<p class="lede">Built for a chemist who wants fundamentals, not another tutorial queue. Every day has one reading target, one code sprint, and a retrieval check. Your ticks and notes save as you go.</p>'+
    '<div id="nextUp" class="next-up pn"></div><div class="stats" id="heroStats"></div>'+
    '<label class="note-small" style="display:inline-flex;gap:.45rem;align-items:center;margin-top:.7rem"><input type="checkbox" id="accToggle" checked> Open one day at a time when I jump between days</label>'+
    spectrumHtml()+'</div>';
  const parts=[start];
  const firstVisit=!Object.keys(state.checks).length&&!state.meta.last&&!Object.keys(state.notes).length;
  parts.push(panel('sec-start','How to use this workbook',INTRO.start,firstVisit));
  parts.push(panel('sec-system','The learning system: how to escape tutorial hell',INTRO.system,false));
  parts.push(panel('sec-setup','Setup checklist',setupHtml()+INTRO.setup,false));
  parts.push(panel('sec-roadmap','Roadmap: all 16 weeks at a glance',roadmapHtml(),false));
  parts.push(PHASES.map(phaseHtml).join(''));
  parts.push('<section class="phase pn" id="sec-ref"><div class="phase-head"><h2>Reference</h2><p>The pieces you return to all sixteen weeks.</p></div></section>');
  parts.push(panel('sec-python','Python and math review starter: graded problems with solutions',INTRO.python+'<div>'+pbHtml()+'</div>',false));
  parts.push(panel('sec-notebook','Notebook: error log, card drafts, questions, wins',notebookHtml(),false));
  parts.push(panel('sec-resources','Resource library: free GitHub, YouTube, docs and papers',INTRO.resources+resourcesHtml(),false));
  parts.push(panel('sec-limits','Honest limits',LIMITS,false));
  parts.push(panel('sec-backup','Backup and export',backupHtml(),false));
  main.insertAdjacentHTML('beforeend',parts.join(''));
  $('#toc').innerHTML=tocHtml();
  smartQuotes(main); smartQuotes($('#toc'));
  cacheRefs();
  refreshAllInputs();
  buildSearchIndex();
}
function wire(){
  document.addEventListener('click',e=>{
    const g=e.target.closest('[data-goto]');
    if(g){ if(g.closest('#searchModal')) $('#searchModal').hidden=true; e.preventDefault(); goTo(g.dataset.goto); return; }
    const a=e.target.closest('a[href^="#"]');
    if(a&&a.getAttribute('href').length>1){ e.preventDefault(); goTo(decodeURIComponent(a.getAttribute('href').slice(1))); return; }
    const cp=e.target.closest('.copy');
    if(cp){ const pre=cp.parentElement.querySelector('pre'); copyText(pre.textContent).then(ok=>{ cp.textContent=ok?'Copied':'Press Ctrl+C'; setTimeout(()=>cp.textContent='Copy',1500); }); return; }
    const tab=e.target.closest('[data-tab]');
    if(tab){ $$('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===tab))); $$('[data-tabpanel]').forEach(p=>p.hidden=p.dataset.tabpanel!==tab.dataset.tab); return; }
    const rf=e.target.closest('[data-rf]');
    if(rf){ const f=rf.dataset.rf; $$('[data-rf]').forEach(b=>b.setAttribute('aria-pressed',String(b===rf))); $$('.res-item').forEach(it=>{ const ok=f==='all'||(f==='essential'&&it.dataset.lvl==='essential')||(f==='read'&&it.dataset.read==='1')||(f==='verify'&&it.dataset.verify==='1')||it.dataset.kind===f; it.hidden=!ok; }); $$('[data-rg]').forEach(gp=>{ gp.hidden=!$$('.res-item',gp).some(it=>!it.hidden); }); return; }
    if(e.target.id==='exportCopy'){ copyText($('#exportBox').value).then(ok=>{ e.target.textContent=ok?'Copied':'Press Ctrl+C'; setTimeout(()=>e.target.textContent='Copy to clipboard',1500); }); return; }
    if(e.target.id==='exportClose'){ $('#exportModal').hidden=true; return; }
    if(e.target.id==='expMd'){ saveFile('mdai-workbook-notes.md',buildMarkdown()); return; }
    if(e.target.id==='expJson'){ saveFile('mdai-workbook-backup.json',buildJSON()); return; }
    if(e.target.classList&&e.target.classList.contains('modal')){ e.target.hidden=true; }
  });
  document.addEventListener('change',e=>{
    const t=e.target;
    if(t.matches('input[data-ck]')) setCheck(t.dataset.ck,t.checked);
    else if(t.id==='accToggle'){ settings.accordion=t.checked; try{ localStorage.setItem('mdai-accordion',t.checked?'1':'0'); }catch(x){} }
    else if(t.id==='impFile'&&t.files&&t.files[0]){
      const r=new FileReader(); r.onload=()=>{ $('#impMsg').textContent=importJSON(String(r.result)); t.value=''; }; r.readAsText(t.files[0]);
    }
  });
  const savedTimers={};
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.matches('[data-note]')){
      setNote(t.dataset.note,t.value);
      const tag=document.querySelector('[data-saved="'+t.dataset.note+'"]');
      if(tag){ tag.textContent='Saving'; clearTimeout(savedTimers[t.dataset.note]); savedTimers[t.dataset.note]=setTimeout(()=>{ tag.textContent='Saved'; },700); }
    }
  });
  $('#menuBtn').addEventListener('click',()=>{ const o=document.body.classList.toggle('toc-open'); $('#menuBtn').setAttribute('aria-expanded',String(o)); });
  $('#backdrop').addEventListener('click',closeToc);
  $('#continueBtn').addEventListener('click',()=>goTo(nextId||ORDER[0]));
  $('#searchBtn').addEventListener('click',openSearch);
  $('#themeBtn').addEventListener('click',()=>{ theme=theme==='auto'?'light':theme==='light'?'dark':'auto'; try{ localStorage.setItem('mdai-theme',theme); }catch(x){} applyTheme(); });
  $('#searchInput').addEventListener('input',e=>runSearch(e.target.value));
  $('#searchInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const a=$('#searchResults a'); if(a){ e.preventDefault(); $('#searchModal').hidden=true; goTo(a.dataset.goto); } } });
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if(e.key==='Escape'){ closeModals(); return; }
    if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='/'){ e.preventDefault(); openSearch(); }
    else if(e.key==='['){ stepDay(-1); } else if(e.key===']'){ stepDay(1); }
  });
  window.addEventListener('scroll',()=>{ if(!spyRaf) spyRaf=requestAnimationFrame(spy); },{passive:true});
  window.addEventListener('hashchange',()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(id&&document.getElementById(id)&&id!==activeId) goTo(id); });
}
function boot(){
  try{ settings.accordion=localStorage.getItem('mdai-accordion')!=='0'; }catch(e){}
  applyTheme();
  finalize();
  loadLocal();
  render();
  const acc=$('#accToggle'); if(acc) acc.checked=settings.accordion;
  wire();
  updateProgress();
  const h=decodeURIComponent((location.hash||'').slice(1));
  if(h&&document.getElementById(h)) setTimeout(()=>goTo(h,{instant:true}),60);
  initSync();
  window.__wb={state,DAYS,ORDER,WEEKS,goTo,updateProgress,flush,setSyncDebug:()=>syncMode};
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
