and b <= 1000])\nprint(f\"plateau {plateau:.4f}  vs analytic {se_true:.4f}  vs naive {table[0][1]:.4f}\")\nassert abs(plateau - se_true) / se_true < 0.25\nassert table[0][1] < 0.5 * se_true                   # block size 1 (naive) underestimates the error\n", "w4d2": "# --- 1) make a 3-D structure of a small test ligand (imidazole) with RDKit ---------------\npython - <<'PY'\nfrom rdkit import Chem\nfrom rdkit.Chem import AllChem\nm = Chem.AddHs(Chem.MolFromSmiles(\"c1c[nH]cn1\"))          # imidazole\nAllChem.EmbedMolecule(m, randomSeed=7); AllChem.MMFFOptimizeMolecule(m)\nChem.MolToPDBFile(m, \"imidazole.pdb\")\nPY\n\n# --- 2) GAFF2 atom types + AM1-BCC charges (needs AmberTools: antechamber, sqm) ----------\nantechamber -i imidazole.pdb -fi pdb -o imidazole.mol2 -fo mol2 \\\n            -c bcc -at gaff2 -nc 0 -rn IMZ -s 2\n\n# --- 3) look for parameters GAFF2 could not find, and write them to a frcmod file ---------\nparmchk2 -i imidazole.mol2 -f mol2 -o imidazole.frcmod -s gaff2\n\n# --- 4) read what you made ----------------------------------------------------------------\nless imidazole.mol2      # atom types in column 6, charges in the last column; do they sum to 0?\nless imidazole.frcmod    # any line marked ATTN, need revision means a guessed parameter\n", "w4d3": "# tleap input: protein (ff19SB) in OPC water, truncated octahedron, 12 A padding, neutralized.\nsource leaprc.protein.ff19SB\nsource leaprc.water.opc             # open $AMBERHOME/dat/leap/cmd/leaprc.water.opc: which ion files does it load?\n\nmol = loadpdb protein_clean.pdb     # run pdb4amber first: renumber, fix residue names, add H\ncheck mol                           # read every warning; do not ignore \"close contact\" lines\ncharge mol                          # net charge BEFORE ions\n\nsolvateOct mol OPCBOX 12.0          # 12 A of water on every side\naddIonsRand mol Na+ 0               # 0 = add exactly as many as needed to neutralize\naddIonsRand mol Cl- 0\ncharge mol                          # must now be ~0.000000\n\nsaveamberparm mol complex.prmtop complex.inpcrd\nsavepdb mol complex_solv.pdb\nquit\n", "w4d4": "# OpenMM: build, solvate, minimize a small protein. NOT executed in my sandbox - run it and read the output.\nfrom pdbfixer import PDBFixer\nfrom openmm.app import ForceField, Modeller, PME, HBonds, Simulation, PDBFile\nfrom openmm import LangevinMiddleIntegrator, Platform\nfrom openmm.unit import kelvin, picosecond, picoseconds, nanometer, molar, kilojoules_per_mole\n\nfixer = PDBFixer(pdbid=\"1L2Y\")                      # Trp-cage, 20 residues (needs internet)\nfixer.findMissingResidues(); fixer.findMissingAtoms(); fixer.addMissingAtoms()\nfixer.addMissingHydrogens(7.0)\n\nff = ForceField(\"amber14-all.xml\", \"amber14/tip3pfb.xml\")   # bundled with OpenMM\nmodel = Modeller(fixer.topology, fixer.positions)\nmodel.addSolvent(ff, padding=1.0 * nanometer, ionicStrength=0.15 * molar)\nprint(\"atoms:\", model.topology.getNumAtoms())\n\nsystem = ff.createSystem(model.topology, nonbondedMethod=PME,\n                         nonbondedCutoff=1.0 * nanometer, constraints=HBonds)\nintegrator = LangevinMiddleIntegrator(300 * kelvin, 1 / picosecond, 0.002 * picoseconds)\nsim = Simulation(model.topology, system, integrator)       # picks the fastest platform (CUDA/OpenCL/CPU)\nsim.context.setPositions(model.positions)\nprint(\"platform:\", sim.context.getPlatform().getName())\n\ne0 = sim.context.getState(getEnergy=True).getPotentialEnergy().value_in_unit(kilojoules_per_mole)\nsim.minimizeEnergy(maxIterations=2000)\ne1 = sim.context.getState(getEnergy=True).getPotentialEnergy().value_in_unit(kilojoules_per_mole)\nprint(f\"potential energy: {e0:.0f} -> {e1:.0f} kJ/mol\")\nassert e1 < e0                                              # minimization must lower the energy\nwith open(\"minimized.pdb\", \"w\") as fh:\n    PDBFile.writeFile(sim.topology, sim.context.getState(getPositions=True).getPositions(), fh)\n# Next: restrain the solute first and release in a second stage (see the restraint code on W5 D1).\n", "w5d1": "# OpenMM: heat 50 -> 300 K in steps with positional restraints on the protein. NOT executed in my sandbox.\nfrom openmm import CustomExternalForce\nfrom openmm.unit import kelvin, kilojoules_per_mole, nanometer\nfrom openmm.app import StateDataReporter\nimport sys\n\n# `system`, `sim`, `integrator`, `model` come from the minimization script (W4 D4).\nrestraint = CustomExternalForce(\"k*((x-x0)^2+(y-y0)^2+(z-z0)^2)\")\nrestraint.addGlobalParameter(\"k\", 1000.0 * kilojoules_per_mole / nanometer**2)\nfor p in (\"x0\", \"y0\", \"z0\"):\n    restraint.addPerParticleParameter(p)\nfor atom in model.topology.atoms():\n    if atom.residue.name not in (\"HOH\", \"NA\", \"CL\") and atom.element.symbol != \"H\":\n        restraint.addParticle(atom.index, model.positions[atom.index].value_in_unit(nanometer))\nsystem.addForce(restraint)\nsim.context.reinitialize(preserveState=True)\n\nsim.context.setVelocitiesToTemperature(50 * kelvin)\nsim.reporters.append(StateDataReporter(sys.stdout, 500, step=True, temperature=True, potentialEnergy=True))\nfor T in range(50, 301, 25):                         # ramp 50, 75, ... 300 K\n    integrator.setTemperature(T * kelvin)\n    sim.step(2000)                                   # 4 ps per rung at 2 fs\n# Then release the restraint in 2-3 stages: sim.context.setParameter(\"k\", 100.0), then 0.0.\n", "w5d2": "# OpenMM: NPT equilibration and density check. NOT executed in my sandbox.\nfrom openmm import MonteCarloBarostat\nfrom openmm.unit import bar, kelvin\nfrom openmm.app import StateDataReporter\nimport sys\n\n# continue from the heated, restrained-then-released system of W5 D1\nsystem.addForce(MonteCarloBarostat(1 * bar, 300 * kelvin))\nsim.context.reinitialize(preserveState=True)\nsim.reporters.append(StateDataReporter(\"npt.csv\", 1000, step=True, time=True, density=True,\n                                       volume=True, temperature=True, potentialEnergy=True))\nsim.step(250_000)                                    # 500 ps at 2 fs\n\nimport pandas as pd\ndf = pd.read_csv(\"npt.csv\"); df.columns = [c.split(\" (\")[0].strip('#\"') for c in df.columns]\nprint(df[[\"Time\", \"Density\"]].tail())\n# Is it equilibrated? Compare the mean density of the first and second halves of the run.\nh = len(df) // 2\nprint(\"density 1st half vs 2nd half:\", df.Density[:h].mean(), df.Density[h:].mean())\n", "w5d3": "# OpenMM: how big a timestep can you get away with? NVE energy drift vs dt. NOT executed in my sandbox.\nimport numpy as np\nfrom openmm import VerletIntegrator\nfrom openmm.app import Simulation, HBonds, PME\nfrom openmm.unit import picoseconds, nanometer, amu, kelvin, kilojoules_per_mole\n\ndef drift(ff, topology, positions, dt_fs, hmr=False, constraints=HBonds, nsteps=5000):\n    kw = dict(nonbondedMethod=PME, nonbondedCutoff=1.0 * nanometer, constraints=constraints)\n    if hmr:\n        kw[\"hydrogenMass\"] = 3.0 * amu               # hydrogen mass repartitioning\n    system = ff.createSystem(topology, **kw)\n    sim = Simulation(topology, system, VerletIntegrator(dt_fs * 1e-3 * picoseconds))\n    sim.context.setPositions(positions)\n    sim.minimizeEnergy(); sim.context.setVelocitiesToTemperature(300 * kelvin)\n    E = []\n    for _ in range(nsteps // 100):\n        sim.step(100)\n        s = sim.context.getState(getEnergy=True)\n        E.append((s.getPotentialEnergy() + s.getKineticEnergy()).value_in_unit(kilojoules_per_mole))\n    return (E[-1] - E[0]) / topology.getNumAtoms()        # drift per atom, kJ/mol\n\n# `ff`, `model` from W4 D4. Compare (dt, constraints, HMR):\nfor dt, hmr in [(1, False), (2, False), (4, False), (4, True)]:\n    print(f\"dt = {dt} fs, HMR = {hmr}: energy drift per atom = \"\n          f\"{drift(ff, model.topology, model.positions, dt, hmr):.4f} kJ/mol\")\n", "w5d4": "# OpenMM: three independent replicas that differ ONLY in the random seed. NOT executed in my sandbox.\nimport copy\nfrom openmm import LangevinMiddleIntegrator\nfrom openmm.app import Simulation, DCDReporter, StateDataReporter\nfrom openmm.unit import kelvin, picosecond, picoseconds\n\n# `system`, `model` from the earlier scripts, with a barostat already added; start from `equilibrated.xml`\nfor seed in (101, 202, 303):                          # the same seeds your Stage 5/6 plan uses\n    integ = LangevinMiddleIntegrator(300 * kelvin, 1 / picosecond, 0.002 * picoseconds)\n    integ.setRandomNumberSeed(seed)\n    sim = Simulation(model.topology, copy.deepcopy(system), integ)\n    sim.loadState(\"equilibrated.xml\")                 # identical starting coordinates for every replica\n    sim.context.setVelocitiesToTemperature(300 * kelvin, seed)   # different velocities per seed\n    sim.reporters.append(DCDReporter(f\"rep_{seed}.dcd\", 5000))\n    sim.reporters.append(StateDataReporter(f\"rep_{seed}.csv\", 5000, step=True, time=True,\n                                           potentialEnergy=True, temperature=True, density=True))\n    sim.step(500_000)                                 # 1 ns smoke test; production is 100 ns\n    sim.saveState(f\"rep_{seed}_end.xml\")              # restart file\n", "w6d1": "# Load the same trajectory with MDAnalysis and MDTraj and check they agree. NOT executed in my sandbox.\nimport numpy as np\nimport MDAnalysis as mda\nimport mdtraj as md\n\ntop, trj = \"complex.prmtop\", \"rep_101.nc\"            # Amber topology + NetCDF (use .pdb + .dcd for the OpenMM runs)\nu = mda.Universe(top, trj)\nt = md.load(trj, top=top)\n\nprint(\"MDAnalysis:\", u.atoms.n_atoms, \"atoms,\", len(u.trajectory), \"frames\")\nprint(\"MDTraj    :\", t.n_atoms, \"atoms,\", t.n_frames, \"frames\")\nassert u.atoms.n_atoms == t.n_atoms and len(u.trajectory) == t.n_frames\n\nu.trajectory[0]\nx_mda = u.atoms.positions                            # Angstrom\nx_mdt = t.xyz[0] * 10.0                              # MDTraj is in nanometres!\nassert np.allclose(x_mda, x_mdt, atol=1e-2)\nprint(\"first-frame coordinates agree (after the nm -> A conversion)\")\n\n# cpptraj / pytraj reads the same file too:\n# import pytraj as pt; traj = pt.load(trj, top=top); print(traj)\n", "w6d2": "import numpy as np\n\ndef kabsch(P, Q):\n    \"\"\"Optimal rotation of P onto Q (both (N,3)). Returns R, rmsd, with  P_centered @ R.T ~ Q_centered.\"\"\"\n    Pc, Qc = P - P.mean(0), Q - Q.mean(0)\n    H = Pc.T @ Qc                                   # 3x3 covariance\n    U, S, Vt = np.linalg.svd(H)\n    d = np.sign(np.linalg.det(Vt.T @ U.T))          # guard against reflections\n    R = Vt.T @ np.diag([1, 1, d]) @ U.T\n    rmsd = np.sqrt((((Pc @ R.T) - Qc) ** 2).sum(1).mean())\n    return R, rmsd\n\nrng = np.random.default_rng(9)\nQ = rng.normal(size=(30, 3))\nA = rng.normal(size=(3, 3)); Qm, _ = np.linalg.qr(A)\nif np.linalg.det(Qm) < 0:\n    Qm[:, 0] *= -1                                  # make it a proper rotation\nP = Q @ Qm.T + np.array([5.0, -2.0, 1.0]) + rng.normal(0, 0.01, Q.shape)\nR, rmsd = kabsch(P, Q)\nprint(\"rmsd after superposition:\", round(rmsd, 4))\nassert rmsd < 0.02 and np.isclose(np.linalg.det(R), 1.0)\n# a mirror image cannot be fixed by a proper rotation\nassert kabsch(P * np.array([1, 1, -1]), Q)[1] > 0.5\n# without superposition the raw RMSD is huge\nassert np.sqrt(((P - Q) ** 2).sum(1).mean()) > 3\n", "w6d3": "import numpy as np\nfrom sklearn.cluster import KMeans\n\nrng = np.random.default_rng(9)\nn_atoms, n_frames = 20, 400\nbase = rng.normal(size=(n_atoms, 3))\nmode = rng.normal(size=(n_atoms, 3)); mode /= np.linalg.norm(mode)      # one collective motion\nstate = (rng.random(n_frames) > 0.5).astype(int)                          # two conformational states\nframes = (base[None] + (2.0 * state[:, None, None] - 1.0) * 1.5 * mode[None]\n          + rng.normal(0, 0.05, (n_frames, n_atoms, 3)))                  # assume frames already aligned\n\nX = frames.reshape(n_frames, -1)\nXc = X - X.mean(0)                                                        # mean-centre\nU, S, Vt = np.linalg.svd(Xc, full_matrices=False)\npcs = Xc @ Vt[:2].T\nvar_ratio = S**2 / (S**2).sum()\nlabels = KMeans(2, n_init=10, random_state=0).fit_predict(pcs)\nagree = max((labels == state).mean(), (labels != state).mean())\nprint(\"variance in PC1/PC2:\", var_ratio[:2].round(3), \"| cluster agreement:\", round(agree, 3))\nassert var_ratio[0] > 0.8 and agree > 0.98\n# PC1 should line up with the planted motion\nassert abs(Vt[0] @ mode.ravel()) > 0.95\n", "w6d4": "import numpy as np\n\nrng = np.random.default_rng(10)\nkT = 1.0\nU0 = lambda x: 3.0 * (x**2 - 1.0) ** 2             # double well, 3 kT barrier\ncenters = np.linspace(-1.6, 1.6, 17); kspring = 20.0\n\ndef sample_window(c, n=40_000, step=0.25):\n    Ub = lambda x: U0(x) + 0.5 * kspring * (x - c) ** 2\n    x = c; u = Ub(x); xs = []\n    for _ in range(n):\n        xn = x + rng.uniform(-step, step); un = Ub(xn)\n        if un <= u or rng.random() < np.exp(-(un - u) / kT):\n            x, u = xn, un\n        xs.append(x)\n    return np.array(xs[2000:])                     # discard equilibration\n\ndata = [sample_window(c) for c in centers]\nbins = np.linspace(-2.0, 2.0, 81); mid = 0.5 * (bins[1:] + bins[:-1])\nH = np.array([np.histogram(d, bins)[0] for d in data])         # (windows, bins)\nN = H.sum(1)\nbias = 0.5 * kspring * (mid[None, :] - centers[:, None]) ** 2  # (windows, bins)\n\nf = np.zeros(len(centers))                                      # window free energies\nfor it in range(5000):                                          # WHAM self-consistent loop\n    denom = (N[:, None] * np.exp((f[:, None] - bias) / kT)).sum(0)\n    P = H.sum(0) / denom\n    f_new = -kT * np.log((P[None, :] * np.exp(-bias / kT)).sum(1))\n    f_new -= f_new[0]\n    if np.max(np.abs(f_new - f)) < 1e-7:\n        break\n    f = f_new\n\nwith np.errstate(divide=\"ignore\"):\n    pmf = -kT * np.log(P / P.max())\nexact = U0(mid) - U0(mid).min()\nok = np.isfinite(pmf) & (np.abs(mid) < 1.5)\npmf -= pmf[ok].min()\nerr = np.abs(pmf[ok] - exact[ok]).max()\nprint(f\"WHAM converged after {it} iterations; max PMF error {err:.2f} kT\")\nassert err < 0.5\n", "w7d1": "import numpy as np\nfrom sklearn.linear_model import LinearRegression\n\nrng = np.random.default_rng(11)\nn, d = 200, 3\nX = rng.normal(size=(n, d))\nw_true = np.array([2.0, -1.0, 0.5]); b_true = 0.7\ny = X @ w_true + b_true + rng.normal(0, 0.3, n)\nXb = np.c_[np.ones(n), X]                           # bias column\n\n# 1) closed form: normal equations\nw_ne = np.linalg.solve(Xb.T @ Xb, Xb.T @ y)\n# 2) gradient descent on the mean squared error\nw = np.zeros(d + 1); lr = 0.1\nfor _ in range(2000):\n    w -= lr * (2 / n) * Xb.T @ (Xb @ w - y)\n# 3) scikit-learn as the referee\nm = LinearRegression().fit(X, y)\nassert np.allclose(w_ne, w, atol=1e-6)\nassert np.allclose(w_ne[1:], m.coef_) and np.isclose(w_ne[0], m.intercept_)\nprint(\"weights [bias, w1..w3]:\", w_ne.round(3))\n", "w7d2": "import numpy as np\n\nrng = np.random.default_rng(12)\ndef make(n, d=15):\n    X = rng.normal(size=(n, d))\n    w = np.r_[3, -2, 1.5, np.zeros(d - 3)]              # only 3 features matter\n    return X, X @ w + rng.normal(0, 2.0, n)\n\nXtr, ytr = make(30); Xte, yte = make(1000)               # few training points, many features\nridge = lambda X, y, lam: np.linalg.solve(X.T @ X + lam * np.eye(X.shape[1]), X.T @ y)\nrmse = lambda X, y, w: np.sqrt(np.mean((X @ w - y) ** 2))\nlams = np.logspace(-3, 3, 13)\ntr = [rmse(Xtr, ytr, ridge(Xtr, ytr, l)) for l in lams]\nte = [rmse(Xte, yte, ridge(Xtr, ytr, l)) for l in lams]\nfor l, a, b in zip(lams, tr, te):\n    print(f\"lambda {l:9.3f}  train RMSE {a:5.2f}  test RMSE {b:5.2f}\")\nbest = lams[int(np.argmin(te))]\nprint(\"best lambda on held-out data:\", best)\nassert min(te) < te[0]                  # some regularization beats none\nassert tr[0] < tr[-1]                   # training error only goes up as lambda grows\n", "w7d3": "import numpy as np\nfrom sklearn.linear_model import Ridge\nfrom sklearn.model_selection import cross_val_score\n\nrng = np.random.default_rng(13)\nX = rng.normal(size=(120, 5))\ny = X @ np.array([1.0, 2.0, 0.0, 0.0, -1.0]) + rng.normal(0, 1, 120)\n\ndef kfold_indices(n, k, seed):\n    idx = np.random.default_rng(seed).permutation(n)\n    return np.array_split(idx, k)\n\ndef cv_rmse(X, y, k=5, alpha=1.0, seed=0):\n    folds = kfold_indices(len(y), k, seed); scores = []\n    for i, test in enumerate(folds):\n        train = np.concatenate([f for j, f in enumerate(folds) if j != i])\n        m = Ridge(alpha=alpha).fit(X[train], y[train])\n        scores.append(np.sqrt(np.mean((m.predict(X[test]) - y[test]) ** 2)))\n    return np.mean(scores), np.std(scores)\n\nmean, std = cv_rmse(X, y)\n# referee: scikit-learn on the SAME folds\nfolds = kfold_indices(len(y), 5, 0)\nsplits = [(np.concatenate([f for j, f in enumerate(folds) if j != i]), folds[i]) for i in range(5)]\nsk = -cross_val_score(Ridge(alpha=1.0), X, y, cv=splits, scoring=\"neg_root_mean_squared_error\")\nassert np.isclose(mean, sk.mean()) and np.isclose(std, sk.std())\nprint(f\"CV RMSE = {mean:.3f} +/- {std:.3f}\")\n", "w7d4": "import numpy as np\nfrom sklearn.feature_selection import SelectKBest, f_regression\nfrom sklearn.linear_model import Ridge\nfrom sklearn.model_selection import KFold, cross_val_score\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\n\nrng = np.random.default_rng(14)\n# Pure noise: 60 samples, 2000 features, random target. The honest R^2 must be <= ~0.\nX = rng.normal(size=(60, 2000)); y = rng.normal(size=60)\ncv = KFold(5, shuffle=True, random_state=0)\n\n# WRONG: choose the 20 'best' features using ALL the data, then cross-validate\nXsel = SelectKBest(f_regression, k=20).fit_transform(X, y)\nleaky = cross_val_score(Ridge(alpha=1.0), Xsel, y, cv=cv, scoring=\"r2\").mean()\n\n# RIGHT: do the selection inside each training fold\npipe = make_pipeline(StandardScaler(), SelectKBest(f_regression, k=20), Ridge(alpha=1.0))\nhonest = cross_val_score(pipe, X, y, cv=cv, scoring=\"r2\").mean()\nprint(f\"leaky CV R2 = {leaky:.2f}   honest CV R2 = {honest:.2f}\")\nassert leaky > 0.1 and honest < 0.05\n", "w8d1": "# Random forest on ESOL solubility with RDKit descriptors. NOT executed in my sandbox (needs rdkit + internet).\nimport pandas as pd, numpy as np\nfrom rdkit import Chem\nfrom rdkit.Chem import Descriptors, AllChem\nfrom sklearn.ensemble import RandomForestRegressor\nfrom sklearn.model_selection import cross_val_score, KFold\n\nurl = \"https://raw.githubusercontent.com/deepchem/deepchem/master/datasets/delaney-processed.csv\"\ndf = pd.read_csv(url)                                        # columns include 'smiles' and 'measured log solubility in mols per litre'\ny = df[\"measured log solubility in mols per litre\"].values\nmols = [Chem.MolFromSmiles(s) for s in df[\"smiles\"]]\n\ndef descriptors(m):\n    return [Descriptors.MolWt(m), Descriptors.MolLogP(m), Descriptors.NumHDonors(m),\n            Descriptors.NumHAcceptors(m), Descriptors.TPSA(m), Descriptors.NumRotatableBonds(m)]\nXd = np.array([descriptors(m) for m in mols])\nXf = np.array([list(AllChem.GetMorganFingerprintAsBitVect(m, 2, 1024)) for m in mols])\n\ncv = KFold(5, shuffle=True, random_state=0)\nfor name, X in [(\"descriptors\", Xd), (\"Morgan fingerprint\", Xf)]:\n    r2 = cross_val_score(RandomForestRegressor(300, random_state=0, n_jobs=-1), X, y, cv=cv, scoring=\"r2\")\n    print(f\"{name:20s} CV R2 = {r2.mean():.2f} +/- {r2.std():.2f}\")\n# Warning: this KFold is RANDOM. Redo it with scaffold groups (W7 D4) and watch the score drop.\n", "w8d2": "# Compare three models and LOG every run in Dataiku Experiment Tracking (MLflow API).\n# NOT executed in my sandbox - it must run inside Dataiku (Code recipe / notebook / Code Studio).\n# Docs: https://doc.dataiku.com/dss/latest/mlops/experiment-tracking/index.html (check your DSS version)\nimport dataiku\nfrom sklearn.ensemble import RandomForestRegressor, GradientBoostingRegressor\nfrom sklearn.svm import SVR\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.model_selection import cross_val_score, KFold\n\nclient = dataiku.api_client()\nproject = client.get_default_project()\nmf = project.get_managed_folder(\"YOUR_MANAGED_FOLDER_ID\")      # artefacts are stored in a managed folder\n\n# X, y: use the feature table from W8 D1 (e.g. df = dataiku.Dataset(\"esol_features\").get_dataframe())\nmodels = {\n    \"rf\": RandomForestRegressor(300, random_state=0, n_jobs=-1),\n    \"gbr\": GradientBoostingRegressor(random_state=0),\n    \"svr\": make_pipeline(StandardScaler(), SVR(C=3.0)),\n}\ncv = KFold(5, shuffle=True, random_state=0)                    # identical folds for a fair comparison\n\nwith project.setup_mlflow(managed_folder=mf) as mlflow:\n    mlflow.set_experiment(\"esol-model-zoo\")\n    for name, model in models.items():\n        with mlflow.start_run(run_name=name):\n            r2 = cross_val_score(model, X, y, cv=cv, scoring=\"r2\")\n            mlflow.log_param(\"model\", name)\n            mlflow.log_param(\"cv\", \"KFold(5, shuffle, seed 0)\")\n            mlflow.log_metric(\"cv_r2_mean\", r2.mean())\n            mlflow.log_metric(\"cv_r2_std\", r2.std())\n# Open the Experiments tab of the project and sort by cv_r2_mean.\n", "w8d3": "import numpy as np\nfrom sklearn.datasets import make_blobs\nfrom sklearn.decomposition import PCA\nfrom sklearn.manifold import TSNE\n\nX, labels = make_blobs(n_samples=300, n_features=20, centers=3,\n                       cluster_std=[1.0, 3.0, 0.5], random_state=0)\nZp = PCA(n_components=2).fit_transform(X)\nZt = TSNE(n_components=2, perplexity=30, init=\"pca\", random_state=0).fit_transform(X)\n\ndef spreads(Z):\n    return np.array([Z[labels == c].std(0).mean() for c in range(3)])\n\nsp, st = spreads(Zp), spreads(Zt)\nprint(\"cluster spread, PCA   :\", sp.round(2), \" max/min =\", round(sp.max() / sp.min(), 1))\nprint(\"cluster spread, t-SNE :\", st.round(2), \" max/min =\", round(st.max() / st.min(), 1))\n# The true widths differ 6x. If t-SNE shows a much smaller ratio, its cluster *sizes* are not data.\nprint(\"true std ratio:\", 3.0 / 0.5)\n", "w8d4": "import numpy as np\nimport pandas as pd\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.ensemble import GradientBoostingRegressor\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.model_selection import GroupKFold, cross_val_score\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\n\nrng = np.random.default_rng(15)\nn = 300\ndf = pd.DataFrame({\n    \"n_heavy_atoms\": rng.integers(10, 40, n),\n    \"logp\": rng.normal(2, 1, n),\n    \"ring_count\": rng.integers(0, 5, n).astype(float),\n    \"series\": rng.choice([\"amide\", \"sulfonamide\", \"urea\"], n),\n    \"scaffold\": rng.choice(list(\"ABCDEF\"), n),         # group id used for splitting, NOT a feature\n})\ndf.loc[rng.random(n) < 0.05, \"logp\"] = np.nan\ny = 0.1 * df.n_heavy_atoms + 0.5 * df.logp.fillna(2) + rng.normal(0, 0.3, n)\n\nnum = [\"n_heavy_atoms\", \"logp\", \"ring_count\"]; cat = [\"series\"]\npre = ColumnTransformer([\n    (\"num\", Pipeline([(\"imp\", SimpleImputer(strategy=\"median\")), (\"sc\", StandardScaler())]), num),\n    (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat),\n])\nmodel = Pipeline([(\"pre\", pre), (\"gbr\", GradientBoostingRegressor(random_state=0))])\nscores = cross_val_score(model, df[num + cat], y, groups=df[\"scaffold\"],\n                         cv=GroupKFold(n_splits=3), scoring=\"r2\")     # whole scaffolds held out\nprint(\"grouped CV R2:\", scores.round(3), \"mean\", scores.mean().round(3))\nassert scores.mean() > 0.6\n", "w9d1": "import numpy as np\n\ndef relu(z): return np.maximum(0, z)\n\nclass MLP:\n    def __init__(self, d_in, d_h, d_out, rng):\n        self.W1 = rng.normal(0, np.sqrt(2 / d_in), (d_in, d_h)); self.b1 = np.zeros(d_h)\n        self.W2 = rng.normal(0, np.sqrt(2 / d_h), (d_h, d_out)); self.b2 = np.zeros(d_out)\n    def forward(self, X):\n        self.X = X\n        self.z1 = X @ self.W1 + self.b1\n        self.a1 = relu(self.z1)\n        return self.a1 @ self.W2 + self.b2\n\nrng = np.random.default_rng(16)\nnet = MLP(3, 8, 1, rng)\nX = rng.normal(size=(5, 3))\nout = net.forward(X)\nassert out.shape == (5, 1)\n\n# Without the nonlinearity, two layers collapse into ONE linear map\nlin = (X @ net.W1 + net.b1) @ net.W2 + net.b2\nW_eff = net.W1 @ net.W2; b_eff = net.b1 @ net.W2 + net.b2\nassert np.allclose(lin, X @ W_eff + b_eff)\nassert not np.allclose(out, lin)            # the ReLU really changes the function\nprint(\"forward pass OK:\", out.ravel().round(3))\n", "w9d2": "import numpy as np\n\nrng = np.random.default_rng(17)\nd_in, d_h, d_out, n = 3, 6, 1, 10\nX = rng.normal(size=(n, d_in)); y = np.sin(X.sum(1, keepdims=True))\nparams = {\"W1\": rng.normal(0, 0.5, (d_in, d_h)), \"b1\": np.zeros(d_h),\n          \"W2\": rng.normal(0, 0.5, (d_h, d_out)), \"b2\": np.zeros(d_out)}\n\ndef forward(p, X):\n    z1 = X @ p[\"W1\"] + p[\"b1\"]; a1 = np.maximum(0, z1)\n    return a1 @ p[\"W2\"] + p[\"b2\"], (z1, a1)\n\ndef loss_fn(p, X, y):\n    out, _ = forward(p, X); return 0.5 * np.mean((out - y) ** 2)\n\ndef backward(p, X, y):\n    out, (z1, a1) = forward(p, X); n = len(X)\n    dout = (out - y) / n                            # dL/d out\n    g = {\"W2\": a1.T @ dout, \"b2\": dout.sum(0)}\n    dz1 = (dout @ p[\"W2\"].T) * (z1 > 0)             # chain rule through the ReLU\n    g[\"W1\"] = X.T @ dz1; g[\"b1\"] = dz1.sum(0)\n    return g\n\ndef num_grad(name, h=1e-6):\n    P = params[name]; G = np.zeros_like(P)\n    it = np.nditer(P, flags=[\"multi_index\"])\n    for _ in it:\n        i = it.multi_index; old = P[i]\n        P[i] = old + h; lp = loss_fn(params, X, y)\n        P[i] = old - h; lm = loss_fn(params, X, y)\n        P[i] = old; G[i] = (lp - lm) / (2 * h)\n    return G\n\ng = backward(params, X, y)\nfor name in params:\n    err = np.abs(g[name] - num_grad(name)).max()\n    print(f\"{name}: max |analytic - numeric| = {err:.2e}\")\n    assert err < 1e-6\n", "w9d3": "import numpy as np\n\nrng = np.random.default_rng(18)\nn = 256\nX = rng.uniform(-3, 3, (n, 1)); y = np.sin(X) + 0.05 * rng.normal(size=X.shape)\n\ndef init(d_in, d_h, d_out, scheme):\n    s1 = np.sqrt(2 / d_in) if scheme == \"he\" else 0.01\n    s2 = np.sqrt(2 / d_h) if scheme == \"he\" else 0.01\n    return {\"W1\": rng.normal(0, s1, (d_in, d_h)), \"b1\": np.zeros(d_h),\n            \"W2\": rng.normal(0, s2, (d_h, d_out)), \"b2\": np.zeros(d_out)}\n\ndef fwd(p, X):\n    z1 = X @ p[\"W1\"] + p[\"b1\"]; a1 = np.maximum(0, z1)\n    return a1 @ p[\"W2\"] + p[\"b2\"], z1, a1\n\ndef grads(p, X, y):\n    out, z1, a1 = fwd(p, X); d = (out - y) / len(X)\n    dz1 = (d @ p[\"W2\"].T) * (z1 > 0)\n    return {\"W2\": a1.T @ d, \"b2\": d.sum(0), \"W1\": X.T @ dz1, \"b1\": dz1.sum(0)}\n\ndef train(p, opt, steps=3000, lr=0.01):\n    m = {k: np.zeros_like(v) for k, v in p.items()}\n    v2 = {k: np.zeros_like(v) for k, v in p.items()}\n    b1, b2, eps = 0.9, 0.999, 1e-8\n    for t in range(1, steps + 1):\n        g = grads(p, X, y)\n        for k in p:\n            if opt == \"sgd\":\n                p[k] -= lr * g[k]\n            else:                                    # Adam with bias correction\n                m[k] = b1 * m[k] + (1 - b1) * g[k]\n                v2[k] = b2 * v2[k] + (1 - b2) * g[k] ** 2\n                p[k] -= lr * (m[k] / (1 - b1 ** t)) / (np.sqrt(v2[k] / (1 - b2 ** t)) + eps)\n    out, *_ = fwd(p, X)\n    return 0.5 * np.mean((out - y) ** 2)\n\nres = {}\nfor scheme in (\"he\", \"small\"):\n    for opt in (\"sgd\", \"adam\"):\n        res[(scheme, opt)] = train(init(1, 32, 1, scheme), opt)\nfor k, v in res.items():\n    print(k, f\"final loss {v:.4f}\")\nassert res[(\"he\", \"adam\")] < res[(\"he\", \"sgd\")]\nassert res[(\"he\", \"adam\")] < 0.05\n", "w9d4": "import numpy as np\ntry:\n    import torch\nexcept ImportError:\n    torch = None\n\nrng = np.random.default_rng(19)\nX = rng.normal(size=(64, 3)); y = np.sin(X.sum(1, keepdims=True))\nW1 = rng.normal(0, 0.5, (3, 8)); b1 = np.zeros(8)\nW2 = rng.normal(0, 0.5, (8, 1)); b2 = np.zeros(1)\n\ndef numpy_step(W1, b1, W2, b2, lr=0.05):\n    z1 = X @ W1 + b1; a1 = np.maximum(0, z1); out = a1 @ W2 + b2\n    loss = 0.5 * np.mean((out - y) ** 2)\n    d = (out - y) / len(X)\n    gW2, gb2 = a1.T @ d, d.sum(0)\n    dz1 = (d @ W2.T) * (z1 > 0)\n    gW1, gb1 = X.T @ dz1, dz1.sum(0)\n    return loss, (W1 - lr * gW1, b1 - lr * gb1, W2 - lr * gW2, b2 - lr * gb2)\n\np, losses_np = (W1, b1, W2, b2), []\nfor _ in range(100):\n    l, p = numpy_step(*p); losses_np.append(l)\nprint(\"NumPy loss: first\", round(losses_np[0], 4), \"-> last\", round(losses_np[-1], 4))\nassert losses_np[-1] < losses_np[0]\n\nif torch is not None:\n    Xt, yt = torch.tensor(X), torch.tensor(y)\n    ps = [torch.tensor(a, requires_grad=True) for a in (W1, b1, W2, b2)]\n    losses_t = []\n    for _ in range(100):\n        out = torch.relu(Xt @ ps[0] + ps[1]) @ ps[2] + ps[3]\n        loss = 0.5 * ((out - yt) ** 2).mean()\n        loss.backward()\n        with torch.no_grad():\n            for q in ps:\n                q -= 0.05 * q.grad; q.grad.zero_()\n        losses_t.append(loss.item())\n    assert np.allclose(losses_np, losses_t, atol=1e-8)\n    print(\"NumPy and PyTorch loss curves match\")\nelse:\n    print(\"PyTorch is not installed here: the NumPy half ran. Install torch to run the parity check.\")\n"};

INTRO.start=`
<p>This is one document you work inside. It replaces the earlier plan and adds working links, a note box on every day, checkboxes that save, a search, and a map that jumps to any week or day. Nothing needs installing to use it.</p>
<h3>The daily loop (about two hours)</h3>
<ol>
<li><b>Open the day.</b> Press <b>Continue</b> in the top bar, click any square in the progress strip, or use the course map. Days are collapsible blocks.</li>
<li><b>Read or watch one target</b> (about 35 minutes). Take notes in your own words in the box at the bottom of the day.</li>
<li><b>Do the code sprint</b> (about an hour). Build it from a blank file first. The hint, starter and reference solution are folded away on purpose; open them in that order, and only after a real attempt.</li>
<li><b>Answer the recall questions</b> out loud or on paper before opening any answer.</li>
<li><b>Write three lines</b> in the notes box and tick the blocks you finished.</li>
</ol>
<h3>The weekly rhythm</h3>
<p>Days 1 to 4 are new material. Day 5 is a closed-book checkpoint quiz. Day 6 is a teach-back, or a mini-project at the end of each phase. Day 7 is light: Anki reviews and one abstract. If you fall behind, drop the optional readings first. Never drop the sprint or the retrieval day, because those are what stop the material from evaporating.</p>
<h3>What the tags on code sprints mean</h3>
<p><span class="tag ok">Reference code run and passing</span> I ran this code, and its own assertions pass (NumPy, SciPy, scikit-learn only).</p>
<p><span class="tag warn">Not run by me: needs OpenMM</span> I wrote it carefully against the documentation, but the packages it needs were not available to me. Treat it as a reviewed draft: run it, and trust your own output over my code.</p>
<h3>Assumptions</h3>
<p>About two hours a day for 16 weeks, with day 7 light. That is roughly 210 to 224 hours: enough for real fundamentals and a modest capstone, not enough to be an expert in two fields. If you slip, each phase can stretch by a week and the capstone can compress to two. I confirmed most links through search results on 17 October 2026 but could not click-test every one from my sandbox. If a link is dead, search its title and note it in the Notebook. Fast-moving or less certain items carry a <span class="tag warn">verify</span> tag in the library.</p>`;

INTRO.system=`
<p>Tutorial hell is recognizing material without being able to produce it. Every rule below forces production.</p>
<ol>
<li><b>Build it from scratch first.</b> Write the NumPy version before you touch the library. The library becomes a referee, not a crutch.</li>
<li><b>One resource per topic.</b> Pick one reading target and finish it. A second video on the same idea is procrastination wearing a study hat.</li>
<li><b>Recall before re-reading.</b> Start each day by answering yesterday's questions from memory. Then check.</li>
<li><b>Spaced repetition.</b> Write three to six Anki cards a day, atomic and in your own words. Cloze for facts; "implement X" for skills.</li>
<li><b>Teach it weekly.</b> If you cannot explain it aloud without notes, you do not own it. The stalls are your next cards.</li>
<li><b>Keep an error log.</b> Every bug and misconception, with the wrong mental model behind it. Read it on checkpoint days.</li>
<li><b>Project first.</b> Each phase ends with something you built. The capstone is your own research pipeline.</li>
<li><b>Commit daily.</b> Fixed random seeds, a dated commit, and a one-line README of what you learned.</li>
</ol>
<h3>Card templates that work</h3>
<ul>
<li><b>Fact (cloze):</b> The effective sample size is N_eff = {{c1::N / (2 tau)}}.</li>
<li><b>Contrast:</b> What does a transposed convolution compute, and what does it not compute?</li>
<li><b>Skill:</b> Without looking, write a function that returns all pairwise distances with broadcasting.</li>
<li><b>Failure mode:</b> Name two ways a bonded metal model fails even when the parameters look sane.</li>
</ul>
<h3>When you feel stuck</h3>
<p>Shrink the problem until it runs, then grow it one line at a time. If a sprint takes under 20 minutes, redo it without looking and then break it on purpose: change a shape, flip a sign, read the error. That is where retention comes from.</p>`;

INTRO.setup=`
<h3>Two environments</h3>
<p>Package names move; if the solver complains, install AmberTools in its own environment.</p>
<div class="codewrap"><button class="copy" type="button" aria-label="Copy code">Copy</button><pre><code>mamba create -n mlbook -c conda-forge python=3.12 numpy scipy pandas matplotlib scikit-learn jupyterlab rdkit pytorch
mamba create -n mdbook -c conda-forge python=3.12 ambertools openmm pdbfixer mdanalysis mdtraj nglview jupyterlab
mamba activate mdbook
python -m openmm.testInstallation</code></pre></div>
<p>AmberTools is free and open source and contains antechamber, tleap, parmed, MCPB.py, cpptraj and MMPBSA.py. The fast GPU engine <code>pmemd.cuda</code> comes with licensed Amber; <code>sander</code> is enough for learning. OpenMM is a Python-native engine you can script from a notebook.</p>
<h3>Where Dataiku fits</h3>
<p>Use it where it removes friction, not as a substitute for writing code. It is not an MD engine; run simulations from the command line or a notebook.</p>
<ul>
<li><b>Data prep and Flow.</b> Ingest the CSVs your analysis scripts write (RMSD, M-N distances, contacts, SASA, per-frame MM/GBSA terms), join them, and build a per-pose feature table. Week 16 day 1.</li>
<li><b>Experiment Tracking.</b> The code API is the MLflow Tracking API, so runs, parameters, metrics and artifacts are saved with each experiment. Week 8 day 2. <a href="https://doc.dataiku.com/dss/latest/mlops/experiment-tracking/index.html" target="_blank" rel="noopener noreferrer">Dataiku docs</a>.</li>
<li><b>Code Studios.</b> A JupyterLab or VS Code session inside the project, so notebooks and the Flow live together.</li>
</ul>`;

<ul>
<li><b>Order.</b> Problems 1 to 5 in week 1 (day 5), problems 6 to 11 in week 2 (day 5). The rest sit beside the sprint they pair with.</li>

INTRO.resources=`
<p>All free. Most entries were confirmed through search results on 17 October 2026; I could not click-test every deep link, so a dead one means search its title. <b>Essential</b> means the plan relies on it; everything else is optional depth. Entries tagged <span class="tag warn">verify</span>, <span class="tag warn">community</span> or <span class="tag warn">new tool</span> deserve a second look before you rely on them.</p>
<h3>How to use a free-resource feed without falling back into tutorial hell</h3>
<ol>
<li>Treat it as a source of leads, not a syllabus. Save a lead only if it matches this week's topic.</li>
<li>Vet before you invest: is there code you run, are there exercises, was it updated in the last two years, is the repository alive (recent commits, answered issues)?</li>
<li>Give a new resource a two-day trial. If it does not produce something you ran, drop it.</li>
<li>Whatever you keep goes into a sprint or a card the same day, or it was entertainment.</li>
</ol>`;

const LIMITS=`
<h3>This is hard, and sixteen weeks is a foundation</h3>
<p>Two mature fields plus a specialised sub-field cannot be mastered in about 220 hours. The plan makes you fluent in fundamentals and able to run, and defend, a careful pipeline. The expertise arrives with the projects you do afterwards.</p>
<h3>Classical force fields and open-shell metals do not mix well</h3>
<p>Fixed-charge, fixed-bonded models cannot represent Cu(II) Jahn-Teller dynamics, spin-state energetics, or bond breaking and forming. MCPB.py bonded models freeze the coordination sphere: reasonable for the rigid square-planar N4 cavity of ZnPc, a real approximation for CuPc. For accuracy at the metal you need QM/MM, ligand-field molecular mechanics, or ML potentials, and you must know which claim you can and cannot make.</p>
<h3>MM/GBSA is comparative only</h3>
<p>It omits conformational entropy and binding-site water thermodynamics, among other approximations. Report ranked, error-barred, same-protocol comparisons and say so. For predictive binding free energies you need alchemical methods (TI or FEP), which is your next phase.</p>
<h3>Sampling is the silent killer</h3>
<p>Short runs under-sample. RMSD curves and especially MM/GBSA look more converged than they are. Always show replica-based errors and state what is not converged. Your own Stage 5 measurement is about 239 ns/day on an RTX 3080 for a roughly 59,000-atom system, so the full 1,800 ns plan is about 7.5 days serial on that card; plan runs you can finish and defend.</p>
<h3>ML on tiny capstone data is illustration, not inference</h3>
<p>Eighteen rows from six poses cannot train a trustworthy model. Use the ML layer to practise leakage-free method, not to make binding claims.</p>
<h3>What I could and could not check</h3>
<p>I ran every NumPy, SciPy and scikit-learn reference solution against its own assertions. I could not run anything that needs OpenMM, AmberTools, MDAnalysis, PyTorch, RDKit, Dataiku, MACE or UMA, and those sprints carry a tag saying so. Version numbers and release notes were checked for GROMACS 2026 (released 19 January 2026) and Amber26/AmberTools26. I could not confirm an OpenMM patch-release date, so check the OpenMM releases page. Re-verify any model or force-field version before you cite it.</p>`;

/* ===== the sixteen weeks: focus, deliverable, quiz, teach-back prompt, light-day reading ===== */
week(1,{phase:0,short:'NumPy and linear algebra',title:'Python, NumPy and linear algebra: rebuild the toolkit',
 focus:'Fluency with arrays, broadcasting, einsum, pandas and plotting. A trajectory is a (frames, atoms, 3) array, so these are the verbs of every later week.',
 deliverable:'Distance-matrix, Gram-matrix and log-plot notebooks committed to git, plus problems 1 to 5 of the review starter solved on your own.',
 tip:'If a sprint takes under 20 minutes, redo it without looking and then break it on purpose: change a shape, read the error.',
 teach:'Explain broadcasting and einsum to someone who knows Excel but not NumPy. Use one worked example with every shape written out.',
 light:['SciPy lecture notes: skim the table of contents','https://scipy-lectures.org/','10 min'],
 problems:[1,2,3,4,5],
 links:[['Python Data Science Handbook (free notebooks)','https://github.com/jakevdp/PythonDataScienceHandbook'],['MolSSI: Python scripting for computational molecular science','https://education.molssi.org/python_scripting_cms']],
 quiz:[
  ['Shapes (5,1,3) and (1,7,3): do they broadcast, and to what?','Yes. Shapes are compared from the rightmost axis and each pair must be equal or 1. The result is (5,7,3).'],
  ['Write the Gram matrix of X (n by 3) as an einsum.','<code>np.einsum("ni,mi->nm", X, X)</code>, the same as <code>X @ X.T</code>.'],
  ['A rotation matrix has which two properties?','It preserves lengths (orthogonal: RᵀR = I) and has determinant +1. A determinant of −1 would be a reflection.'],
  ['Why is the vectorized distance matrix far faster than nested loops, and what does it cost?','The work runs in compiled code over contiguous memory instead of the interpreter. The cost is memory: the intermediate (N, M, 3) array holds 3NM numbers.'],
  ['When do you use a DataFrame rather than an ndarray?','When columns have names or different types, or you need group-by, joins or time-indexed operations. Use arrays for homogeneous numeric blocks such as coordinates.']]});

week(2,{phase:0,short:'Calculus, convolution, first MD loop',title:'Calculus, probability, convolution and a first MD loop',
 focus:'Gradients are forces, averages have error bars, a convolution is a matrix, and velocity Verlet is the loop inside every MD engine.',
 deliverable:'A working 2-D Lennard-Jones velocity-Verlet simulation with a radial distribution function, plus problems 6 to 11 solved.',
 tip:'The MD loop you write on day 4 is reused in week 3 for error analysis. Keep the file tidy.',
 teach:'Explain why a transposed convolution is not an inverse of a convolution, using the matrix picture with a three-tap kernel.',
 light:['Best practices for uncertainty and sampling in molecular simulations: abstract and Figure 1','https://doi.org/10.33011/livecoms.1.1.5067','15 min'],
 problems:[6,7,8,9,10,11],
 quiz:[
  ['Why is force the negative gradient of the potential energy?','Force points toward lower energy and its magnitude is the slope: F = −∇U. You verified it: central differences reproduce the analytic Lennard-Jones force.'],
  ['The standard deviation is 2.0 and you have 10,000 independent samples. What is the standard error of the mean?','σ/√N = 2.0/100 = 0.02.'],
  ['Is a transposed convolution the inverse of a convolution?','No. It is the adjoint, multiplication by the transpose of the convolution matrix. It maps shapes back but does not recover the input values.'],
  ['Why velocity Verlet and not explicit Euler?','Velocity Verlet is time-reversible and symplectic, so its energy error stays bounded. Euler\'s energy grows without limit; in problem 11 the two differ by many orders of magnitude.'],
  ['What does the minimum-image convention do?','For each pair it uses the nearest periodic copy, so no distance exceeds half a box length per axis. Without it, atoms near opposite faces look far apart.']]});

week(3,{phase:1,short:'Statistical mechanics and error bars',title:'Statistical mechanics for MD, and honest error bars',
 focus:'Ensembles, free energy, ergodicity, and why correlated frames mean fewer independent samples than you think.',
 deliverable:'A small tool that computes autocorrelation, integrated autocorrelation time, effective sample size and block-averaged standard error.',
 tip:'Do not skip the Grossfield guide. It is the single best free text on what an MD error bar means.',
 teach:'Why is molecular dynamics fundamentally a sampling problem? Include correlation time and what "converged" can and cannot mean.',
 light:['OpenMM user guide: skim the contents before next week','https://docs.openmm.org/latest/userguide/','15 min'],
 links:[['Erik Lindahl: molecular biophysics lectures (ENCCS)','https://enccs.se/2021/03/news/molecular-biophysics/'],['Lecture timestamps and topics for the same series','https://drugdesign.org/external/erik-lindahl/'],['Grossfield et al., free full text (PMC)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6286151'],['Companion code for the uncertainty guide','https://github.com/dmzuckerman/Sampling-Uncertainty']],
 quiz:[
  ['What is held fixed in NVE, NVT and NPT?','NVE: particle number, volume, energy. NVT: number, volume, temperature (thermostat). NPT: number, pressure, temperature (thermostat plus barostat).'],
  ['State equipartition and give ⟨E⟩ for a 1-D harmonic oscillator.','Each quadratic degree of freedom carries kT/2 on average, so a 1-D oscillator (kinetic plus potential) has ⟨E⟩ = kT.'],
  ['State the ergodic hypothesis and one way MD violates it in practice.','Time averages equal ensemble averages. In practice a barrier of several kT can trap a run in one basin for far longer than you simulate; your double-well run stayed in one well.'],
  ['Why does ignoring autocorrelation make error bars too small?','Correlated frames carry less new information. The effective sample size is N/(2τ), so the true standard error is larger than σ/√N by √(2τ).'],
  ['How do you know your blocks are long enough in block averaging?','The block-based standard error rises with block size and then plateaus. The plateau is the honest error; before it, blocks are still correlated.']]});

week(4,{phase:1,short:'Engines, force fields, build and minimize',title:'Engines, force fields and water models; build and minimize',
 focus:'What exists (Amber, GROMACS, OpenMM, NAMD, LAMMPS and others), what a force field family actually is, and the first half of the workflow: prepare, solvate, ionize, minimize.',

 teach:'Choose an engine, force field and water model for a metalloprotein-ligand system and defend each choice in two sentences.',
 light:['ff19SB paper: abstract and introduction','https://doi.org/10.1021/acs.jctc.9b00591','15 min'],
 links:[['Amber tutorials: force field and antechamber','https://ambermd.org/tutorials/ForceField.php'],['awesome-molecular-dynamics (curated list)','https://github.com/ipudu/awesome-molecular-dynamics'],['MD_starting_package (curated starter links)','https://github.com/anicoli/MD_starting_package']],
 quiz:[
  ['Why prepare a system in AmberTools but possibly run it in OpenMM or GROMACS?','tleap, antechamber and MCPB.py give the best-supported Amber parameter workflow, while OpenMM and GROMACS can read the topology and may suit your hardware or custom physics. Check that the force field is transferred faithfully.'],
  ['Why must water and ion parameters match the protein force field?','Force fields are fitted as a balanced set; mixing protein, water and ion parameters from different sets breaks the balance of hydration and interactions.'],
  ['Which water model is recommended with ff19SB, and what is the practical consequence?','OPC. Use leaprc.water.opc and the OPC box, and check which ion parameters that leaprc loads.'],
  ['What does "charge mol" in tleap tell you, and when do you run it?','It prints the net charge. It should be an integer before ions and about 0.000 after neutralization. A non-integer charge signals a parameter or protonation error.'],
  ['What does minimization fix that would otherwise break the dynamics?','Steric clashes and bad contacts that create enormous forces. Without it the first MD steps can diverge.']]});

week(5,{phase:1,short:'Equilibration and production',title:'Heating, NVT and NPT, constraints, and production with replicas',
 focus:'Thermostats and barostats, PME, constraints and timesteps, restraints, and why you run independent replicas with different seeds.',
 deliverable:'A documented equilibration of a small protein in water, and three production replicas that differ only in their random seed.',
 tip:'Write down the reason for every protocol step. Each one protects you from a specific failure.',
 teach:'Narrate the whole pipeline from prepared PDB to production, saying what each stage protects you from.',
 light:['OPC water model paper: abstract','https://doi.org/10.1021/jz501780a','15 min'],
 links:[['Lemkul GROMACS tutorial: lysozyme in water (best free walk-through of equilibration logic)','http://www.mdtutorials.com/gmx/lysozyme/index.html'],['OpenMM user guide','https://docs.openmm.org/latest/userguide/'],['Amber GPU performance benchmarks','https://ambermd.org/GPUPerformance.php']],
 quiz:[
  ['Why is the Berendsen thermostat a poor choice for production?','It rescales velocities to the target temperature without producing correct canonical fluctuations (the flying-ice-cube artifact). Use Langevin or Nose-Hoover for production.'],
  ['How do you know NPT density has equilibrated?','The running density stops drifting: first-half and second-half means agree within their errors and the volume fluctuates around a stable value.'],
  ['What does PME compute that a plain cutoff cannot?','Long-range electrostatics in a periodic box via Ewald summation on a grid, instead of truncating them.'],
  ['Why can you use 2 fs with constraints, and what does hydrogen mass repartitioning change?','Constraining X-H bonds removes the fastest vibrations. HMR moves mass onto hydrogens to slow the remaining fast motions, allowing about 4 fs.'],
  ['Why three independent replicas rather than one run three times longer?','Independent starts sample different basins and give an honest between-replica error bar. One long run can sit in one basin and look converged.']]});

week(6,{phase:1,short:'Trajectory analysis and enhanced sampling',title:'Trajectories, analysis and enhanced sampling',
 focus:'Formats and tools, RMSD with the Kabsch algorithm, RMSF, SASA, PCA and clustering, and a survey of what you do when plain MD cannot cross the barrier.',

 links:[['MDAnalysis user guide','https://userguide.mdanalysis.org/stable/index.html'],['MDTraj examples (GitHub)','https://github.com/mdtraj/mdtraj/tree/master/examples'],['cpptraj manual','https://amber-md.github.io/cpptraj/CPPTRAJ.xhtml']],
 project:{title:'Phase 1 mini-project: a small protein, end to end',goal:'Take a small protein (Trp-cage 1L2Y or villin headpiece), run prepare, minimize, heat, NPT and a short production in OpenMM, then analyze it with honest error bars.',
  steps:['Build and solvate with PDBFixer and OpenMM (or tleap with ff19SB and OPC).','Minimize, heat with restraints, equilibrate in NPT, and check the density plateau.','Run three production replicas that differ only in the random seed (a few nanoseconds each is enough).','In one notebook: backbone RMSD with your own Kabsch, per-residue RMSF, SASA, one PCA, one clustering.','Report every quantity as mean across replicas with the between-replica standard error, and add the block-averaged error from one replica for comparison.'],
  deliverable:'One notebook, one README page, and a git tag. Include a paragraph on which quantities are converged on your timescale and which clearly are not.'},
 quiz:[
  ['Which tools read which formats, and what is the units trap?','MDAnalysis and MDTraj read most formats (NetCDF, DCD, XTC); pytraj and cpptraj read Amber formats natively. MDTraj uses nanometres while MDAnalysis and Amber use angstroms.'],
  ['Why superpose before RMSD, and what does RMSF show that RMSD does not?','Without superposition, overall translation and rotation dominate. RMSD summarises one frame against a reference; RMSF shows which residues move most, averaged over the trajectory.'],
  ['What do the first principal components of a protein trajectory usually capture?','The largest collective motions, such as domain or loop movements. They depend on the alignment and on what was actually sampled.'],
  ['When is plain MD hopeless and enhanced sampling necessary?','When the event crosses barriers of many kT on timescales far beyond what you can run, such as unbinding or large conformational changes.'],
  ['Why must umbrella-sampling windows overlap?','WHAM stitches windows together through the overlap of their histograms. Without overlap the free-energy offsets between windows are undetermined.']]});

week(7,{phase:2,short:'Classical ML I: validation and leakage',title:'Classical ML I: regression, validation and leakage',
 focus:'Regression, regularization and bias-variance, cross-validation, and above all the ways molecular and time-series data leak between training and test.',
 deliverable:'From-scratch regression and k-fold cross-validation that match scikit-learn, and a leakage demonstration you can explain.',
 tip:'A good validation score you do not believe is more useful than a great one you do. Learn to attack your own numbers.',
 teach:'How would you validate a model on MD-derived features without fooling yourself? Name the split, the baseline and the null test.',
 light:['Kapoor and Narayanan on leakage in ML-based science (arXiv)','https://arxiv.org/abs/2207.07048','15 min'],
 links:[['Google Machine Learning Crash Course','https://developers.google.com/machine-learning/crash-course'],['dmol.pub: Deep Learning for Molecules and Materials','https://dmol.pub/'],['ISLP: free textbook','https://www.statlearning.com/'],['homemade-machine-learning (algorithms with math)','https://github.com/trekhleb/homemade-machine-learning']],
 quiz:[
  ['What does ordinary least squares assume?','A linear relationship, independent errors with constant variance (and roughly normal errors for inference), and features that are not perfectly collinear.'],
  ['What does increasing λ in ridge regression do to bias and variance?','It increases bias and decreases variance by shrinking the weights toward zero.'],
  ['Why report the cross-validation mean and its spread?','A single mean hides how much the score depends on the split; the spread shows how stable the estimate is.'],
  ['Why is a random split dangerously optimistic for congeneric molecular series and for MD frames?','Near-duplicate molecules or consecutive frames land on both sides, so the model is graded on things it has effectively seen. Split by scaffold, by pose or run, or forward in time.'],
  ['Name a classic leakage bug and its fix.','Scaling or selecting features on all the data before splitting. Fit every transform inside the training fold, for example with a scikit-learn Pipeline.']]});

week(8,{phase:2,short:'Classical ML II: trees, boosting, clustering',title:'Classical ML II: trees, boosting, SVM, clustering and features',
 focus:'Tree ensembles, boosting, kernel methods, dimensionality reduction, and feature pipelines, with experiment tracking in Dataiku.',
 deliverable:'A small model zoo on a molecular dataset with every run logged in Dataiku Experiment Tracking.',

 light:['How to use t-SNE effectively (Distill)','https://distill.pub/2016/misread-tsne/','15 min'],
 links:[['scikit-learn user guide','https://scikit-learn.org/stable/user_guide.html'],['TeachOpenCADD: cheminformatics notebooks','https://projects.volkamerlab.org/teachopencadd/'],['RDKit: getting started in Python','https://www.rdkit.org/docs/GettingStartedInPython.html'],['Dataiku Experiment Tracking docs','https://doc.dataiku.com/dss/latest/mlops/experiment-tracking/index.html']],
 quiz:[
  ['Why does averaging de-correlated trees reduce variance?','Each tree overfits differently; averaging cancels uncorrelated errors, and random feature subsets keep the trees diverse.'],
  ['When does boosting beat bagging, and what is its risk?','Boosting fits residuals sequentially and often wins on tabular data. It can overfit if depth, learning rate or number of rounds are not controlled.'],
  ['Why can t-SNE or UMAP mislead?','They preserve local neighbourhoods, not global distances or cluster sizes. In the sprint, clusters of true width ratio 6 came out the same size.'],
  ['Descriptor, fingerprint, learned representation: what is the difference?','A descriptor is a named numeric property; a fingerprint is a bit vector of substructures; a learned representation is produced by a trained model.'],
  ['Why log every run in Experiment Tracking?','So you can reproduce and compare runs: parameters, metrics and artifacts are stored with the run instead of living in your memory.']]});

  ['Why do you need a nonlinearity between linear layers?','Without it, stacked linear layers collapse into one linear map, as the sprint showed.'],
  ['Write the chain of derivatives from the loss back to W1.','dL/dout, then dL/dW2 = a1ᵀ·dout; da1 = dout·W2ᵀ; dz1 = da1 ⊙ 1[z1>0]; dL/dW1 = Xᵀ·dz1.'],

  ['What does Adam add to plain SGD?','Per-parameter adaptive step sizes from running estimates of the gradient mean and squared gradient, with bias correction.'],
  ['What did PyTorch give you that NumPy did not?','Automatic differentiation, GPU execution, and a library of tested layers and optimizers.']]});

 project:{title:'Phase 2 mini-project: a property predictor you can defend',goal:'Train three models on a molecular dataset (random forest baseline, an MLP, and a one-layer graph model preview) with a scaffold split, and prove which one wins and why.',
  steps:['Pick a dataset (ESOL solubility is the standard small one) and compute descriptors or fingerprints with RDKit.','Make a scaffold split and a random split. Report both and the gap between them.','Train the random forest baseline, an MLP, and a small graph layer built from your week 13 message-passing sketch or a PyG tutorial.','Log every run in Dataiku Experiment Tracking with the same folds.','Add a null test: shuffle the targets and show that the models lose their skill.'],
  deliverable:'A notebook, a one-page note on which model wins and why the random-split score is misleading, and a git tag.'},
 quiz:[
  ['What is the output size of a valid convolution with stride s?','floor((H − k)/s) + 1 along each axis; padding p replaces H with H + 2p first.'],
  ['What does a transposed convolution upsample, and is it an inverse?','It spreads each input element through the kernel into a larger output (the adjoint of the convolution). It is not an inverse.'],
  ['What problem do LSTM gates address?','Vanishing and exploding gradients over long sequences: the gated, additive memory path lets gradients flow across many steps.'],

week(11,{phase:3,short:'Metal ion models',title:'Metal-ion models: nonbonded, bonded and dummy-atom',
 focus:'Why metals are hard for classical force fields, the three strategies and when each fails, the 12-6-4 potential, the Seminario method, and the cationic dummy atom model.',
 deliverable:'A one-page decision tree for choosing a metal model, a plot of 12-6 against 12-6-4, and your own Seminario force-constant code.',
 tip:'Read the Li and Merz review for the map, not for every equation. It is open access.',
 teach:'Describe the three classical metal models and the situation in which each one fails.',
 light:['mdprep: a new tool for reproducible Amber metal-system preparation (check maturity)','https://pypi.org/project/mdprep/','10 min'],
 links:[['Li and Merz, Metal Ion Modeling Using Classical Mechanics (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC5312828'],['Li, Song and Merz: 12-6-4 model (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4306492'],['Amber metal ion modeling tutorial','https://ambermd.org/tutorials/advanced/tutorial20'],['MCPB.py bonded model workflow','https://ambermd.org/tutorials/advanced/tutorial20/bonded_model.php']],
 quiz:[
  ['What does the bonded model buy you, and what can it never represent?','Fixed coordination geometry and stable structures at low cost. It cannot represent bond breaking or forming, or changes in coordination number.'],
  ['Why does 12-6-4 outperform 12-6 for highly charged ions?','The added −C4/r⁴ term represents the ion-induced dipole interaction that a plain 12-6 potential omits, so one parameter set can match hydration free energy and ion-oxygen distance together.'],
  ['Why derive metal-ligand force constants from the QM Hessian?','Generic parameters do not exist for most metal sites. The Hessian gives site-specific bond and angle stiffness in a consistent way.'],
  ['What does the cationic dummy atom model fix?','It enforces directional coordination geometry (for example tetrahedral Zn) by spreading the charge over dummy atoms, without bonded terms to the metal.'],
  ['Give two reasons a bonded model can fail even when the parameters pass the screening rules.','The coordination changes during the simulation, or the electronic structure cannot be captured by a fixed harmonic model (open-shell Jahn-Teller metals, spin changes).']]});

  ['List the MCPB.py steps and the QM output each one needs.','Step 1 builds the models and writes QM inputs. After the QM runs, step 2 uses the small-model Hessian (Seminario by default), step 3 uses the large-model Merz-Kollman ESP for RESP charges, and step 4 writes the tleap input.'],
  ['What goes wrong if the metal residue is named Zn instead of ZN?','MCPB.py does not recognise it as a metal ion. Names must be capitalised element symbols and the metal must be its own residue.'],
  ['Which screening criteria does the tutorial give, and which one needs care for ZnPc?','Bond k below 200 kcal/mol/Å² with r0 below 2.8 Å, angle k below 100, equilibrium angles above 100 degrees, metal dihedral barriers near zero, metal RESP charge below its oxidation state, LJ radius above 1 Å. The angle rule does not suit square-planar N-Zn-N at 90 degrees.'],
  ['Why is CuPc harder than ZnPc?','Cu(II) is d9 and open shell, with Jahn-Teller and spin effects that a fixed parameter set cannot follow. Zn(II) is d10, spherical, with a rigid planar cavity.'],
  ['What do you do if a coordination bond breaks in the QM small-model optimization?','Change method or basis set, try a staged optimization, or obtain the parameters another way (for example a PES scan), edit the frcmod and recheck.']]});

week(13,{phase:3,short:'ML potentials and trajectory ML',title:'ML interatomic potentials, equivariant networks and trajectory ML',
 focus:'Graphs and message passing, equivariance, the SchNet to NequIP to MACE lineage, foundation models trained on metal complexes, and Markov state models for trajectories.',
 deliverable:'The phase 3 mini-project: an ML-potential single point on your ZnPc fragment compared with your classical parameters, plus a memo on which method suits CuPc.',
 tip:'Check element coverage before you trust a model. Coverage mismatch is the most common silent failure.',
 teach:'Explain why energy is invariant and forces are equivariant, and what that means for network design.',
 light:['UMA: a family of universal models for atoms (arXiv abstract)','https://arxiv.org/abs/2506.23971','15 min'],
 links:[['MACE repository and pretrained models','https://github.com/ACEsuit/mace'],['MACE documentation','https://mace-docs.readthedocs.io'],['fairchem: UMA and OMol25 code','https://github.com/facebookresearch/fairchem'],['deeptime: Markov state models and VAMPnets','https://deeptime-ml.github.io/'],['PyTorch Geometric documentation','https://pytorch-geometric.readthedocs.io/'],['Stanford CS224W lectures (graph ML)','https://www.youtube.com/playlist?list=PLoROMvodv4rPLKxIpqhjhPgdQy7imNkDn']],
 project:{title:'Phase 3 mini-project: classical metal model against an ML potential',goal:'Compare your classical ZnPc parameters with a pretrained ML potential and decide, in writing, what is appropriate for CuPc.',
  steps:['Take the optimized QM (or MM) geometry of your ZnPc fragment and compute a single-point energy and forces with UMA (omol task). Note the charge and spin you set.','Compare the Zn-N distances and core planarity from your MM-minimized structure, the ML potential, and the QM reference if you have one.','Try MACE-OFF on the organic frame only, and record exactly what it refuses to do with the metal.','Write a one-page memo: for CuPc, when is a classical bonded model adequate, when do you need an ML potential, and when QM/MM?'],
  deliverable:'A notebook and the memo. The memo must state what claim each method can and cannot support.'},
 quiz:[
  ['Why are graphs a more natural input than SMILES for molecules?','A graph has the right symmetry and locality: relabelling atoms does not change the molecule, and message passing follows bonds.'],
  ['Why must forces rotate with the molecule while the energy stays fixed?','Energy is a scalar (invariant). Forces are the gradient of energy with respect to positions, a vector field that must rotate with the coordinates (equivariant).'],
  ['What can MACE-OFF not do, and what covers metal complexes?','MACE-OFF covers only H, C, N, O, F, P, S, Cl, Br and I. Metal complexes need a model trained on them, such as the OMol25-trained UMA task, still checked against your own QM.'],
  ['What does a Markov state model give you that RMSD plots do not?','A kinetic model: states, transition probabilities, implied timescales and equilibrium populations.'],
  ['Name one thing an ML potential gives over GAFF for a metal site, and one cost.','Near-DFT accuracy in the training domain and the ability to follow changing coordination. The cost is much slower dynamics and failure outside the training data.']]});

week(14,{phase:4,short:'Build the capstone systems',title:'Capstone I: build the systems',
 focus:'Receptor preparation from 6M0J, ligand parameterization for ZnPc, CuPc and F16-ZnPc, poses, and assembling consistent solvated complexes.',
 deliverable:'Six prepared, neutral, solvated complexes (three ligands, two poses each) with a parameterization log that states the limits of each model.',
 tip:'Keep the box, padding and ionic strength identical across ligands. Otherwise a comparative ranking compares box artifacts.',
 teach:'List every input that goes into one capstone system and say why it is there.',
 light:['PoseBusters: AI docking methods and physical validity','https://doi.org/10.1039/D3SC04185A','15 min'],
 links:[['RCSB entry 6M0J','https://www.rcsb.org/structure/6M0J'],['Your PhD repository','https://github.com/ANest58/PhD'],['Stage 4 docking poses (PR 14)','https://github.com/ANest58/PhD/pull/14'],['Stage 3 force-field gates (PR 12)','https://github.com/ANest58/PhD/pull/12'],['AutoDock Vina documentation','https://autodock-vina.readthedocs.io/']],
 problems:[],
 quiz:[
  ['Which chains in 6M0J are which, and what do you keep?','Chain A is ACE2 and chain E is the spike receptor-binding domain. For ligand binding to the RBD you keep chain E protein atoms and decide deliberately about glycans, waters and ions.'],
  ['Why MD-rescore docked poses?','Docking scores are crude and lack metal-specific terms. MD tests whether a pose survives with a flexible protein and explicit solvent. Docking is a hypothesis generator.'],
  ['How many NaCl pairs for 150 mM with 14,012 waters?','round(0.150 × 14012 / 55.5) = 38 pairs, added on top of the neutralizing ions.'],
  ['Why keep box size and ionic strength consistent across ligands?','Differences in padding or salt change energies and fluctuations, which would contaminate a comparative MM/GBSA ranking.'],
  ['What must the CuPc log say that the ZnPc log need not?','That the metal is open shell, which multiplicity the QM used, that a fixed bonded model cannot follow Jahn-Teller dynamics, and therefore that conclusions are approximate.']]});

week(15,{phase:4,short:'Run, analyze and rank',title:'Capstone II: equilibrate, produce, analyze and rank',
 focus:'Sizing runs on real GPUs, equilibration checks at the metal site, the survival gate, replica statistics, and a comparative MM/GBSA ranking with honest error bars.',
 deliverable:'Analysis of every replica, a survival-gate decision per pose, and a ranking that says which differences are real and which are ties.',
 tip:'Fix the survival-gate thresholds before you look at the results. Moving them afterwards is p-hacking by another name.',
 teach:'Review your own capstone protocol as a skeptical referee: what are its five weakest points?',
 light:['Genheden and Ryde: MM/PBSA and MM/GBSA review, abstract','https://pmc.ncbi.nlm.nih.gov/articles/PMC4487606','15 min'],
 links:[['Stage 5 MD and survival gate (PR 16)','https://github.com/ANest58/PhD/pull/16'],['Amber MMPBSA.py tutorial','https://ambermd.org/tutorials/advanced/tutorial3/'],['Genheden and Ryde (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4487606'],['Hou et al.: assessing MM/PBSA and MM/GBSA (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC3029230'],['Amber GPU performance','https://ambermd.org/GPUPerformance.php']],
 quiz:[
  ['What is a survival gate, and why use one?','A cheap pass/fail screen (ligand stays near the pocket, metal coordination intact) applied to short runs before spending compute on long production and MM/GBSA. Thresholds are fixed before looking at results.'],
  ['Why can the same GPU-hours finish in 10 hours or in 8 days?','Independent replicas run in parallel. Wall time is waves times hours per job, while cost follows total GPU-hours.'],
  ['Which error bar should you report for a replica-averaged quantity?','The spread between replicas (the standard error across independent runs), not a frame-level error that treats correlated frames as independent.'],
  ['What does MM/GBSA leave out?','Conformational entropy and the thermodynamics of binding-site water, among other approximations. Use it only for same-protocol comparisons.'],
  ['With three replicas, when do you call two ligands different?','When the difference exceeds about two standard errors of the difference and survives your protocol checks. Otherwise report a tie.']]});

week(16,{phase:4,short:'ML layer, AI literacy, synthesis',title:'Capstone III: ML layer, AI literacy and final synthesis',
 focus:'A small and honest ML layer on capstone features, co-folding and affinity models with their caveats, responsible use of LLMs for scientific code, and the write-up.',
 deliverable:'The final capstone report: methods, ranked results with error bars and caveats, limitations, and a plan for the next sixteen weeks.',
 tip:'The report is written for a skeptical colleague. Lead with what you can and cannot claim.',
 teach:'Present the capstone in five minutes: question, method, result with error bars, and the three weakest points.',
 light:['Best Practices for Scientific Computing (Wilson et al.)','https://doi.org/10.1371/journal.pbio.1001745','15 min'],
 links:[['Boltz (open-source co-folding and affinity models)','https://github.com/jwohlwend/boltz'],['Co-folding and memorisation (ResearchGate)','https://www.researchgate.net/publication/388828996_Have_protein-ligand_co-folding_methods_moved_beyond_memorisation'],['Open Force Field initiative','https://openforcefield.org/'],['Alchemistry: free-energy calculations','https://alchemistry.org/wiki/Main_Page']],
 project:{title:'Final capstone report and next-sixteen-weeks plan',goal:'Write the capstone up for a skeptical colleague and decide what you do next.',
  steps:['Methods: system, force fields, protocol, replicas and seeds, thresholds fixed in advance.','Results: per-pose survival, replica-averaged observables with between-replica errors, and the MM/GBSA ranking with ties called ties.','Limitations: open-shell copper, frozen bonded coordination, MM/GBSA omissions, sampling, tiny ML dataset.','Next steps: more replicas and length, alchemical free energy for the best pairs, QM/MM or an ML potential for the metal site.','Plan the next sixteen weeks, including one thing you will drop.'],
  deliverable:'A 3 to 5 page report in the repository, tagged. Send it to one person for criticism.'},
 quiz:[
  ['Why is the 18-row capstone dataset too small for inference?','It holds only six independent poses; replicas are not independent. Grouped cross-validation is unstable, and in the sprint pure noise looked predictive about one time in eight.'],
  ['What would you not conclude from a Boltz-2 affinity number for a metallophthalocyanine?','That it ranks your complexes. Training data and metal handling are limited, so treat it as a weak prior at best.'],
  ['What is your rule for trusting LLM-written analysis code?','Never ship it unverified: write a test that fails on a planted bug, compare with a from-scratch version, and read every line that touches physics or units.'],
  ['What do benchmarks say about co-folding methods and memorization?','Performance drops on novel ligands and pockets, and physical-validity checks such as PoseBusters matter.'],
  ['Name three things you would do next with far more compute.','More and longer replicas; alchemical free energy (TI or FEP) for the best pairs; QM/MM or ML-potential refinement of the metal site.']]});
