day(1,1,{title:'Setup and NumPy broadcasting',
 goal:'Compute every pairwise distance between two sets of atoms without a Python loop, and know exactly why the shapes line up.',
 read:[['NumPy: absolute basics for beginners','https://numpy.org/doc/stable/user/absolute_beginners.html','15 min'],['NumPy: broadcasting rules','https://numpy.org/doc/stable/user/basics.broadcasting.html','15 min'],['Miniforge: install and make your two environments','https://github.com/conda-forge/miniforge','5 min']],
 watch:[['YouTube search: NumPy broadcasting explained',YT('numpy broadcasting explained visually')]],
 explore:[['Python Data Science Handbook, the NumPy chapters (runnable notebooks)','https://github.com/jakevdp/PythonDataScienceHandbook'],['MolSSI Python scripting lesson 1 (syntax refresher for chemists)','https://education.molssi.org/python_scripting_cms']],
 sprint:{title:'Sprint: all pairwise distances with broadcasting',tested:true,
  problem:'<p>Given coordinate arrays <code>a</code> with shape (5,3) and <code>b</code> with shape (7,3), compute the (5,7) matrix of distances without a Python loop, and check it against <code>scipy.spatial.distance.cdist</code>. Then compute the distances of <code>a</code> to itself and confirm the matrix is symmetric with a zero diagonal.</p>',
  hint:'<p>Insert axes with <code>None</code>: <code>a[:, None, :]</code> has shape (5,1,3) and <code>b[None, :, :]</code> has shape (1,7,3). Subtract, square, sum over the last axis, take the square root.</p>',
  starter:'import numpy as np\nfrom scipy.spatial.distance import cdist\n\nrng = np.random.default_rng(0)\na = rng.normal(size=(5, 3))\nb = rng.normal(size=(7, 3))\n\n# TODO: D with shape (5, 7), no loops\n# TODO: assert np.allclose(D, cdist(a, b))\n',
  solution:'w1d1',
  why:'<p>Broadcasting aligns shapes from the right and stretches size-1 axes. Every analysis from RMSD to the radial distribution function starts this way, and the intermediate (N, M, 3) array is the reason you chunk when N gets large.</p>'},
 recall:[['State the broadcasting rule. Do (5,1,3) and (1,7,3) broadcast, and to what?','Compare shapes from the rightmost axis. Each pair must be equal or one of them must be 1. These broadcast to (5,7,3).'],['Why is the vectorized version faster than a double loop, and what does it cost in memory?','The loop runs in the Python interpreter; the vectorized form runs compiled code over contiguous memory. The intermediate (N, M, 3) array costs 3NM floats.'],['What is the shape of a trajectory tensor, and which axis do you average over to get a mean structure?','(frames, atoms, 3). Average over axis 0.']]});

day(1,2,{title:'Linear algebra as geometry',
 goal:'See matrices as transformations, so rotations, projections and the Hessian later stop being symbol-pushing.',
 read:[['3Blue1Brown, Essence of Linear Algebra, chapters 1 to 4','https://www.3blue1brown.com/topics/linear-algebra','40 min']],
 watch:[['YouTube search: Gilbert Strang 18.06 linear algebra lectures',YT('Gilbert Strang 18.06 linear algebra MIT OpenCourseWare')]],
 explore:[['NumPy linear algebra routines','https://numpy.org/doc/stable/reference/routines.linalg.html'],['homemade-machine-learning: the math behind each algorithm','https://github.com/trekhleb/homemade-machine-learning']],
 sprint:{title:'Sprint: matrix multiplication three ways',tested:true,
  problem:'<p>Implement matrix multiplication with three nested loops, then with <code>np.einsum</code>, then with <code>@</code>. Check all three agree and time them. Then verify two geometric facts: a rotation matrix preserves lengths and has determinant 1, and the determinant of a diagonal matrix is the area scale factor.</p>',
  hint:'<p>Use a modest size (80 by 80) for the loop version. The point is the ratio, not the absolute time.</p>',
  starter:'import time\nimport numpy as np\n\ndef matmul_loops(A, B):\n    # TODO: three nested loops, no @, no einsum\n    ...\n',
  solution:'w1d2',
  why:'<p>Loops, einsum and <code>@</code> compute identical numbers. The speed gap is why you never write loops over atoms in an analysis.</p>'},
 recall:[['Geometrically, what does multiplying a vector by a matrix do?','It applies a linear transformation: columns of the matrix are where the basis vectors land, so the vector is stretched, rotated, sheared or projected accordingly.'],['What does the determinant measure, and what does a negative one mean?','The factor by which areas (volumes) scale. A negative determinant means orientation is flipped, as in a reflection.'],['Why must shapes be (n,m) @ (m,p)?','Each output entry is a dot product of a row of A with a column of B, so the inner dimensions must match.']]});

day(1,3,{title:'Tensors, shapes and einsum',
 goal:'Read and write einsum strings fluently, because every later model (graph networks, attention) is a few einsums.',
 read:[['NumPy einsum reference','https://numpy.org/doc/stable/reference/generated/numpy.einsum.html','10 min'],['CS231n: Python and NumPy tutorial','https://cs231n.github.io/python-numpy-tutorial/','25 min']],
 watch:[['YouTube search: einsum explained',YT('numpy einsum explained')]],
 explore:[['scipy-lectures: the NumPy chapter','https://scipy-lectures.org/']],
 sprint:{title:'Sprint: four einsums',tested:true,
  problem:'<p>Use <code>np.einsum</code> to compute (a) a batch of dot products, (b) the Gram matrix of a set of vectors, (c) a batched matrix-vector product, and (d) both <code>A @ B</code> and <code>trace(A @ B)</code>. Check each against a plain NumPy expression.</p>',
  hint:'<p>Name every index. An index that appears twice on the input side is multiplied; an index missing from the output is summed.</p>',
  starter:'import numpy as np\nrng = np.random.default_rng(2)\nX = rng.normal(size=(6, 3)); Y = rng.normal(size=(6, 3))\nA = rng.normal(size=(4, 5)); B = rng.normal(size=(5, 4))\nM = rng.normal(size=(6, 3, 3)); v = rng.normal(size=(6, 3))\n# TODO: dots, G, Mv, AB, tr with einsum, each checked against NumPy\n',
  solution:'w1d3'},
 recall:[['Write A @ B and trace(A @ B) as einsum strings.','<code>"ij,jk->ik"</code> and <code>"ij,ji->"</code>.'],['What do repeated indices and missing output indices mean?','Repeated input indices are multiplied elementwise; any index absent from the output is summed over.'],['Why is thinking in named axes better than thinking in loops?','It states the computation once, lets the library choose the efficient order, and is the notation papers use.']]});

day(1,4,{title:'pandas and matplotlib on a toy MD log',
 goal:'Load a simulation log, smooth it, drop equilibration, and plot it so the picture tells the truth.',
 read:[['pandas: 10 minutes to pandas','https://pandas.pydata.org/docs/user_guide/10min.html','15 min'],['Matplotlib quick start guide','https://matplotlib.org/stable/users/explain/quick_start.html','20 min']],
 watch:[['YouTube search: pandas rolling mean tutorial',YT('pandas rolling mean tutorial')]],
 explore:[['MolSSI: working with tabular data and plotting lessons','https://education.molssi.org/python_scripting_cms']],
 sprint:{title:'Sprint: a toy energy and temperature log',tested:true,
  problem:'<p>Create a CSV of (time, energy, temperature) that relaxes to a plateau with noise, load it with pandas, add a 50-point rolling mean, drop the first 20 percent as equilibration, report the mean energy, and save a two-panel figure.</p>',
  hint:'<p><code>df["energy"].rolling(50, min_periods=1).mean()</code> and <code>df.iloc[int(0.2*len(df)):]</code>.</p>',
  solution:'w1d4',
  why:'<p>Dropping the start is a modelling choice, not a formality: the sample you average over must come from the equilibrated part of the run.</p>'},
 recall:[['When do you use a DataFrame instead of a NumPy array?','When columns are named or mixed in type, or you need group-by, joins or time-indexed operations.'],['Why drop the first 20 percent of a run?','The system is still relaxing from the starting structure; averaging it in biases the result. Check that the choice does not change the answer much.'],['What should every plot axis carry?','A label with units. A plot without units cannot be checked.']]});

day(2,1,{title:'Gradients, forces and gradient descent',
 goal:'Check a gradient numerically, and see that an MD force is just the negative gradient of the potential.',
 read:[['3Blue1Brown, Essence of Calculus, chapters 1 to 4','https://www.3blue1brown.com/topics/calculus','40 min']],
 explore:[['micrograd: a tiny autograd engine (read the README now, build it in week 9)','https://github.com/karpathy/micrograd']],
 sprint:{title:'Sprint: numerical gradient, Lennard-Jones force, gradient descent',tested:true,
  problem:'<p>Write a central-difference gradient function. Test it on a quadratic whose gradient you know. Use it to confirm that the analytic Lennard-Jones force equals the negative derivative of the potential at several distances, and that the force vanishes at r = 2^(1/6). Finish with a plain gradient-descent loop that solves A x = b.</p>',
  hint:'<p>Central differences: <code>(f(x+h) - f(x-h)) / (2h)</code>. Loop over coordinates and perturb one at a time.</p>',
  solution:'w2d1',
  why:'<p>This gradient check is the same habit you will use to verify backpropagation in week 9 and ML-potential forces in week 13.</p>'},
 recall:[['Why is force the negative gradient of the potential energy?','Force points toward lower energy and its size is the slope: F = −∇U.'],['Why central differences instead of forward differences?','The error shrinks as h squared instead of h, so you get more accuracy for the same step.'],['What goes wrong if the step size h is too small or too large?','Too large: truncation error dominates. Too small: floating-point cancellation dominates. Around 1e-5 to 1e-6 works for smooth functions in double precision.']]});

day(2,2,{title:'Probability and error bars',
 goal:'Feel, with your own simulation, that the standard error of a mean shrinks like one over the square root of N, and why that matters for MD.',
 read:[['Seeing Theory: basic probability and frequentist inference','https://seeing-theory.brown.edu/','30 min']],
 explore:[['Grossfield et al.: read only the introduction now (free full text)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6286151']],
 sprint:{title:'Sprint: standard error scales as 1/sqrt(N)',tested:true,
  problem:'<p>For sample sizes from 10 to 100,000, repeat an experiment 300 times, measure the spread of the sample mean, and fit the slope on a log-log plot. It should be close to −1/2 and match σ/√N.</p>',
  hint:'<p>The standard error is the standard deviation of the <i>sample mean</i> across repeated experiments, not of the data.</p>',
  solution:'w2d2',
  why:'<p>Everything in the next week hinges on the word "independent". MD frames are not, so N in this formula is smaller than the number of frames.</p>'},
 recall:[['What is the difference between the standard deviation of the data and the standard error of its mean?','The standard deviation describes spread of the data; the standard error describes uncertainty of the mean and shrinks as σ/√N for independent samples.'],['What does the central limit theorem say, informally?','Averages of many independent samples are approximately normally distributed, whatever the shape of the underlying distribution.'],['Why will this formula be wrong for consecutive MD frames?','Consecutive frames are correlated, so the effective number of independent samples is smaller than N.']]});

day(2,3,{title:'Convolution and transposed convolution',
 goal:'Write a convolution and its transpose, and prove with the adjoint identity that "deconvolution" does not invert anything.',
 read:[['CS231n: convolutional networks','https://cs231n.github.io/convolutional-networks/','25 min'],['A guide to convolution arithmetic for deep learning (skim the transposed convolution chapter)','https://arxiv.org/abs/1603.07285','15 min']],
 watch:[['YouTube search: transposed convolution explained',YT('transposed convolution explained')]],
 explore:[['Distill: Deconvolution and checkerboard artifacts','https://distill.pub/2016/deconv-checkerboard/']],
 sprint:{title:'Sprint: 1-D convolution as a matrix, and its adjoint',tested:true,
  problem:'<p>Implement a valid-mode 1-D convolution (the deep-learning kind, which is cross-correlation), build the matrix <code>C</code> with <code>C @ x == conv(x)</code>, then implement the transposed convolution as scatter-add and show it equals <code>C.T @ z</code>. Verify <code>&lt;conv(x), z&gt; == &lt;x, convT(z)&gt;</code>, and show that convT(conv(x)) is not x.</p>',
  hint:'<p>Each row of <code>C</code> is the kernel shifted one step. The transposed operation spreads each input value through the kernel into a longer output.</p>',
  solution:'w2d3',
  why:'<p>Transposed convolution maps shapes back; it does not recover values. That is the whole reason "deconvolution" is a misnomer in deep learning.</p>'},
 recall:[['Why is "deconvolution" a misnomer in deep learning?','What is computed is the transposed convolution, the adjoint of the convolution matrix. It is not an inverse.'],['What is the output length of a valid convolution with stride s?','floor((n − k)/s) + 1.'],['np.convolve flips the kernel and a deep-learning convolution does not. Why does that not matter for learning?','The network learns the kernel, so a flipped kernel is just a different set of learned weights.']]});

day(2,4,{title:'Integration: a velocity Verlet Lennard-Jones simulation',
 goal:'Write the loop inside every MD engine: forces, velocity Verlet, periodic boundaries, and a radial distribution function.',
 read:[['MolSSI mm-tools: introduction to molecular mechanics and the first MD lesson','https://education.molssi.org/mm-tools/','30 min'],['Erik Lindahl lecture 6 (simulation, molecular dynamics, minimisation)','https://enccs.se/2021/03/news/molecular-biophysics/','30 min']],
 explore:[['MolSSI resources: the ab initio MD workshop builds a tiny MD program','https://education.molssi.org/resources'],['Drexel introductory molecular simulation class (from awesome-molecular-dynamics)','http://www.pages.drexel.edu/~cfa22/msim/msim.html']],
 sprint:{title:'Sprint: 2-D Lennard-Jones fluid with a class, an RDF and an XYZ file',tested:true,
  problem:'<p>Write a class that holds positions, velocities and forces for 100 particles in a periodic 2-D box (reduced units), computes Lennard-Jones forces with the minimum-image convention and a shifted cutoff, and advances with velocity Verlet. Run 3,000 steps, monitor the total energy, average a radial distribution function over the second half, and write frames to an XYZ file. Energy drift per particle should stay tiny.</p>',
  hint:'<p>Velocity Verlet: half-kick, drift, recompute forces, half-kick. Remove centre-of-mass drift from the initial velocities and rescale them to the target temperature.</p>',
  solution:'w2d4',
  why:'<p>Read the energy trace before you trust anything else. A drift here means a bug or a timestep that is too large, exactly as in a real engine.</p>',
  extra:'<p class="note-small">Extension: problem 17 in the review starter checks your Maxwell-Boltzmann initialization.</p>'},
 recall:[['Why velocity Verlet?','It is time-reversible and symplectic, so energy error stays bounded over long runs.'],['What does the minimum-image convention do?','It uses the nearest periodic copy of each neighbour, so distances never exceed half a box length per axis.'],['What does a cutoff plus a shift do to energy conservation?','Truncating the potential makes forces jump at the cutoff and breaks exact conservation; shifting makes the energy continuous and reduces the drift. Smoother schemes reduce it further.']]});

const LIND=['Erik Lindahl, molecular biophysics lectures','https://enccs.se/2021/03/news/molecular-biophysics/'];
const GROSS=['Grossfield et al., best practices for uncertainty and sampling (free full text)','https://pmc.ncbi.nlm.nih.gov/articles/PMC6286151'];
const WITH=(a,what,mins)=>[a[0]+': '+what,a[1],mins];

day(3,1,{title:'Ensembles and the partition function',
 goal:'Know what NVE, NVT and NPT mean and verify equipartition by brute-force integration.',
 read:[WITH(LIND,'lecture 3, thermodynamics, entropy and free energy (first half)','35 min'),['Chris Cramer, Statistical Molecular Thermodynamics (lecture list on this page)','https://bisb.uni-bayreuth.de/teaching/lectures/','optional']],
 watch:[['YouTube search: Cramer statistical molecular thermodynamics',YT('Chris Cramer Statistical Molecular Thermodynamics lectures')]],
 explore:[['Drexel: an introductory class in molecular simulation','http://www.pages.drexel.edu/~cfa22/msim/msim.html'],['awesome-molecular-dynamics: books and classes section','https://github.com/ipudu/awesome-molecular-dynamics']],
 sprint:{title:'Sprint: equipartition by numerical integration',tested:true,
  problem:'<p>For a 1-D harmonic oscillator, build a grid over position and momentum, weight each point by exp(−H/kT), and compute the average energy, average kinetic energy and average potential energy. They should come out as kT, kT/2 and kT/2.</p>',
  hint:'<p>The grid spacing is constant, so it cancels in the ratio of sums. Make the range wide enough that the weight is negligible at the edges.</p>',
  solution:'w3d1',
  why:'<p>Statistical mechanics is a recipe for averages: weight states by a Boltzmann factor and average. MD is a way to generate those states when you cannot sum over them.</p>'},
 recall:[['What is held fixed in NVE, NVT and NPT, and which one does a thermostat produce?','NVE fixes number, volume and energy; NVT fixes number, volume and temperature (thermostat); NPT fixes number, pressure and temperature (thermostat plus barostat).'],['State equipartition.','Each quadratic degree of freedom contributes kT/2 to the average energy.'],['What is the partition function for?','It normalizes the Boltzmann weights and generates every thermodynamic average; free energy is A = −kT ln Z.']]});

day(3,2,{title:'Free energy and ergodicity',
 goal:'Watch time averages converge to ensemble averages, and watch them fail when a barrier is too high.',
 read:[WITH(LIND,'lecture 3, second half, and lecture 2 on force fields and energy','30 min'),WITH(GROSS,'sections 1 and 2','20 min')],
 explore:[['Alchemistry: free-energy background','https://alchemistry.org/wiki/Main_Page']],
 sprint:{title:'Sprint: Metropolis Monte Carlo on a two-state system, and a trapped double well',tested:true,
  problem:'<p>Simulate a two-state system with the Metropolis rule and compare occupancies with the Boltzmann ratio. Then run a double well with an 8 kT barrier and a small step, starting in the left well, and measure the fraction of time spent on the left. The exact answer is one half. What does your run say?</p>',
  hint:'<p>Accept a move with probability min(1, exp(−ΔE/kT)). For the double well, U(x) = 8 (x² − 1)².</p>',
  solution:'w3d2',
  why:'<p>The second part is the central problem of the field: the equations are right and the run is still wrong because it never crossed the barrier.</p>'},
 recall:[['State the ergodic hypothesis and one way MD violates it in practice.','Time averages equal ensemble averages. A barrier of several kT can trap a finite run in one basin.'],['What does it mean that sampling is the central problem of MD?','Correct physics is not enough: observables are only reliable if the run visits the relevant states with the right frequency.'],['Why is Metropolis acceptance based on exp(−ΔE/kT)?','It satisfies detailed balance with respect to the Boltzmann distribution, so the visited states have the right frequencies in the long run.']]});

day(3,3,{title:'Correlation times and effective sample size',
 goal:'Compute the autocorrelation function and integrated autocorrelation time, and see how much too small a naive error bar is.',
 read:[WITH(GROSS,'sections on autocorrelation and block averaging','30 min'),['Companion code for the guide','https://github.com/dmzuckerman/Sampling-Uncertainty','optional']],
 explore:[['Companion repository: browse the analysis notebooks','https://github.com/dmzuckerman/Sampling-Uncertainty']],
 sprint:{title:'Sprint: autocorrelation, tau and N_eff on a correlated signal',tested:true,
  problem:'<p>Generate an AR(1) signal with coefficient 0.9 (its exact integrated autocorrelation time is (1+φ)/(2(1−φ)) = 9.5). Write the autocorrelation function and an integrated-autocorrelation-time estimator with a sensible window. Compute N_eff = N/(2τ) and compare naive and corrected standard errors of the mean.</p>',
  hint:'<p>τ = 1/2 + Σ ρ(k). Stop summing once k exceeds a few times the running τ, or noise will dominate.</p>',
  solution:'w3d3',
  why:'<p>The corrected standard error is about four times larger than the naive one here. Reporting the naive one is the most common honest mistake in the field.</p>',
  extra:'<p class="note-small">Pairs with problem 12 in the review starter.</p>'},
 recall:[['Why does ignoring autocorrelation make error bars too small?','Correlated frames carry less information. N_eff = N/(2τ) is smaller than N, so the true error is larger.'],['What is the integrated autocorrelation time, in words?','Roughly the time you must wait for the signal to forget itself; every 2τ gives about one independent sample.'],['What goes wrong if you sum the autocorrelation out to the full length?','The tail is pure noise and swamps the estimate. That is why windowing is used.']]});

day(3,4,{title:'Integration: block averaging',
 goal:'Get a correct error bar from a correlated time series using blocks, and recognise the plateau.',
 read:[WITH(GROSS,'the block averaging section again, now with code in hand','20 min')],
 sprint:{title:'Sprint: block-averaged standard error and the plateau',tested:true,
  problem:'<p>Write a function that splits a series into blocks and returns the standard error of the mean for each block size. Run it on a long AR(1) series, find the plateau, and compare it with the analytic value. Then run it on the potential energy from your week 2 Lennard-Jones simulation.</p>',
  hint:'<p>Reshape the first m·b points into (m, b), average over the last axis, and take std(ddof=1)/√m.</p>',
  solution:'w3d4',
  why:'<p>If the standard error never plateaus, the run is too short for the question. That is information, not failure.</p>',
  extra:'<p class="note-small">Pairs with problem 13 in the review starter.</p>'},
 recall:[['How do you know your blocks are long enough?','The standard error rises with block size and then plateaus; the plateau is the estimate.'],['What do you do if there is no plateau?','The series is too short relative to its correlation time. Run longer, or report that the quantity is unconverged.'],['Why is the block-1 value the naive error?','With blocks of one frame you are treating every frame as independent.']]});

day(4,1,{title:'The engine landscape',
 goal:'Know what each major MD engine is good at and what its licence and input style are, so the choice is reasoned.',
 read:[['AmberTools: what is in the free suite','https://ambermd.org/AmberTools.php','10 min'],['GROMACS 2026 highlights (ported AMBER force fields, NNP/MM, HIP)','https://gromacs-manual.biophysics.kth.se/2026.0/release-notes/2026/major/highlights.html','10 min'],['OpenMM user guide: introduction','https://docs.openmm.org/latest/userguide/','10 min'],['Erik Lindahl lecture 6 (simulation and molecular dynamics)','https://enccs.se/2021/03/news/molecular-biophysics/','optional']],
 explore:[['awesome-molecular-dynamics','https://github.com/ipudu/awesome-molecular-dynamics'],['MD_starting_package','https://github.com/anicoli/MD_starting_package'],['awesome-AI4MolConformation-MD (AI meets MD)','https://github.com/AspirinCode/awesome-AI4MolConformation-MD'],['LAMMPS','https://www.lammps.org/']],
 sprint:{title:'Sprint: build your own engine comparison table',
  problem:'<p>In your notes, make a table with one row per engine (Amber, GROMACS, OpenMM, NAMD, LAMMPS, CHARMM, Desmond) and columns for strength, licence, input style, and "use it when". Write only facts you can defend from a docs page you opened. Then open the reference table and mark every disagreement; resolve each by reading the primary source.</p>',
  hint:'<p>Keep each cell to one line. If you cannot name the page that supports a cell, write "unknown" and look it up.</p>',
  solutionHtml:'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Engine</th><th>Strength</th><th>Licence (verify)</th><th>Input style</th><th>Use it when</th></tr></thead><tbody>'+
   '<tr><td>Amber (pmemd.cuda, sander)</td><td>Very fast single-GPU biomolecular PME; best-supported Amber force fields; MCPB.py, MMPBSA.py and cpptraj in AmberTools</td><td>AmberTools free and open source; pmemd needs an Amber licence</td><td>prmtop, inpcrd, mdin</td><td>Amber force fields, metal parameterization, MM/GBSA, your Stage 5 and 6 pipeline</td></tr>'+
   '<tr><td>GROMACS</td><td>Fast on CPU and GPU, huge community; the 2026 series ports AMBER14SB and AMBER19SB with OPC and OPC3</td><td>Open source (LGPL)</td><td>.top, .gro, .mdp, .tpr</td><td>High-throughput production, free tutorials by Justin Lemkul</td></tr>'+
   '<tr><td>OpenMM</td><td>Python-first, custom forces, GPU, reads Amber, GROMACS and CHARMM files, ML potentials via openmm-ml</td><td>Open source (MIT and LGPL parts)</td><td>Python script</td><td>Prototyping, custom physics, ML/MM, notebooks</td></tr>'+
   '<tr><td>NAMD</td><td>Scales to very large systems on clusters; Amber and CHARMM force fields</td><td>Free for non-commercial use under the UIUC licence</td><td>.conf with psf or prmtop</td><td>Huge systems on many nodes</td></tr>'+
   '<tr><td>LAMMPS</td><td>Materials, polymers and soft matter; very large potential library; ML-potential interfaces</td><td>Open source (GPL)</td><td>Input scripts</td><td>Non-biomolecular systems and custom potentials</td></tr>'+
   '<tr><td>CHARMM</td><td>Reference implementation of the CHARMM force field and many methods</td><td>Licence required</td><td>.inp with psf</td><td>CHARMM-specific features</td></tr>'+
   '<tr><td>Desmond</td><td>Fast GPU MD with a polished workflow</td><td>Schr&ouml;dinger and D. E. Shaw Research; check the non-commercial terms</td><td>.cms and .msj</td><td>Schr&ouml;dinger-based projects</td></tr>'+
   '</tbody></table></div><p class="note-small">Licences and release features change. This is a checking exercise, not a source of record: open each project\'s own page.</p>'},
 recall:[['Why might you prepare in AmberTools but run production in OpenMM or GROMACS?','tleap, antechamber and MCPB.py are the best-supported route for Amber parameters, while OpenMM and GROMACS can read the result and may fit your hardware or custom-physics needs. Check the force field survives the transfer.'],['What does OpenMM give you that a command-line engine does not?','A Python API: custom forces, scripted protocols and easy ML-potential experiments.'],['Which engine families can run ML potentials today?','OpenMM through openmm-ml, GROMACS 2026 through its NNP interface (including MACE-style models), and LAMMPS through its ML interfaces. Check each project\'s documentation.']]});

day(4,2,{title:'Force-field families and your first ligand parameterization',
 goal:'Know the families (Amber ff19SB, CHARMM, OPLS, GAFF2, OpenFF), and run antechamber on a small ligand while reading every file it writes.',
 read:[['Amber tutorials: force field and antechamber with GAFF','https://ambermd.org/tutorials/ForceField.php','20 min'],['ff19SB paper (abstract, introduction)','https://doi.org/10.1021/acs.jctc.9b00591','15 min'],['Open Force Field initiative: what Sage is','https://openforcefield.org/','10 min']],
 explore:[['GROMACS 2026 now ships AMBER19SB with OPC: read the release notes','https://gromacs-manual.biophysics.kth.se/2026.0/release-notes/2026/major/highlights.html']],
 sprint:{title:'Sprint: GAFF2 atom types and AM1-BCC charges for imidazole',needs:'AmberTools and RDKit',
  problem:'<p>Build a 3-D imidazole with RDKit, run <code>antechamber</code> with GAFF2 atom types and AM1-BCC charges, then run <code>parmchk2</code>. Read the mol2 and frcmod files: do the charges sum to zero, and do any lines say "ATTN, need revision"?</p>',
  hint:'<p>antechamber options: <code>-c bcc</code> for AM1-BCC charges, <code>-at gaff2</code> for atom types, <code>-nc 0</code> for net charge, <code>-s 2</code> for verbose status.</p>',
  solution:'w4d2'},
 recall:[['Why must water model and ion parameters match the protein force field?','The sets are fitted together; mixing them breaks the balance of hydration and interactions.'],['What is AM1-BCC?','A fast charge model: semiempirical AM1 charges corrected with bond-charge increments to mimic HF/6-31G* RESP charges.'],['What does parmchk2 do?','It looks for bonded parameters GAFF2 could not assign and writes guesses to a frcmod file, flagged for review.']]});

day(4,3,{title:'Water models, protonation and building with tleap',
 goal:'Build a solvated, neutral protein system and read what each tleap command did.',
 read:[['AmberTools manuals and tutorials (tleap chapter)','https://ambermd.org/Manuals.php','25 min'],['PROPKA: pKa predictions for protonation states','https://github.com/jensengroup/propka','10 min'],['OpenMM Cookbook: simulating a protein','https://openmm.github.io/openmm-cookbook/latest/cookbook','optional']],
 explore:[['Amber tutorials hub','https://ambermd.org/tutorials/']],
 sprint:{title:'Sprint: a tleap script for ff19SB and OPC in a truncated octahedron',needs:'AmberTools',
  problem:'<p>Write a tleap input that loads ff19SB and OPC, loads a cleaned protein, solvates it in a truncated octahedron with 12 Å padding, neutralizes with Na+ and Cl-, and saves topology and coordinates. Print the net charge before and after, and open the leaprc files to see which ion parameters were loaded.</p>',
  hint:'<p><code>solvateOct mol OPCBOX 12.0</code>, <code>addIonsRand mol Na+ 0</code> (0 means add exactly enough to neutralize), <code>charge mol</code>.</p>',
  solution:'w4d3'},
 recall:[['Why is OPC the recommended partner for ff19SB?','ff19SB was parameterized with OPC-type four-site water in mind, and OPC describes water thermodynamics better than TIP3P.'],['What does charge mol tell you?','The net charge: an integer before ions and about zero after neutralization. Anything else signals a parameter or protonation problem.'],['Why choose HID, HIE or HIP for histidine on purpose?','The protonation state changes hydrogen bonding and charge. The default may be wrong for your pocket.']]});

day(4,4,{title:'Integration: solvate and minimize in OpenMM',
 goal:'Run a complete small prepare-solvate-minimize workflow in code and confirm the energy falls.',
 read:[['OpenMM user guide: simulation basics and energy minimization','https://docs.openmm.org/latest/userguide/','20 min'],['PDBFixer','https://github.com/openmm/pdbfixer','10 min'],['OpenMM Cookbook','https://openmm.github.io/openmm-cookbook/latest/cookbook','optional']],
 explore:[['OpenMM Cookbook tutorials page','https://openmm.github.io/openmm-cookbook/latest/tutorials.html']],
 sprint:{title:'Sprint: Trp-cage in water, minimized',needs:'OpenMM and PDBFixer (and internet for the PDB)',
  problem:'<p>Fetch Trp-cage (1L2Y) with PDBFixer, add hydrogens at pH 7, solvate in a 1 nm padded box with 0.15 M salt, create a PME system with HBond constraints, minimize, and report the potential energy before and after. Which platform did OpenMM choose?</p>',
  hint:'<p>Amber force fields bundled with OpenMM: <code>amber14-all.xml</code> and <code>amber14/tip3pfb.xml</code>. Recent OpenMM versions may also ship ff19SB and OPC files; look in the force-field data directory.</p>',
  solution:'w4d4'},
 recall:[['What does minimization fix that would otherwise break the dynamics?','Steric clashes and bad contacts that produce huge forces.'],['What do HBonds constraints do?','They hold bonds involving hydrogen at fixed length, removing the fastest vibrations so a 2 fs step is stable.'],['Why do you minimize the solute with restraints first in a real protocol?','So the water relaxes around the experimental structure before the protein is allowed to move.']]});

day(5,1,{title:'Heating and thermostats',
 goal:'Heat a restrained protein from 50 K to 300 K in stages and watch the temperature follow.',
 read:[['Lemkul: lysozyme in water (read the equilibration pages)','http://www.mdtutorials.com/gmx/lysozyme/index.html','30 min'],['OpenMM user guide: integrators','https://docs.openmm.org/latest/userguide/','15 min']],
 explore:[['Amber tutorials hub (compare how Amber heats a system)','https://ambermd.org/tutorials/']],
 sprint:{title:'Sprint: staged heating with positional restraints',needs:'OpenMM',
  problem:'<p>Add a positional restraint force on protein heavy atoms, assign velocities at 50 K, then raise the Langevin target temperature in 25 K steps up to 300 K, running a few picoseconds per rung. Plot the temperature against time.</p>',
  hint:'<p><code>CustomExternalForce("k*((x-x0)^2+(y-y0)^2+(z-z0)^2)")</code> with a global parameter k, and <code>integrator.setTemperature</code> between rungs.</p>',
  solution:'w5d1'},
 recall:[['Why restrain the solute during heating?','So the structure does not distort while water and temperature are still equilibrating.'],['Why is a Berendsen thermostat a poor choice for production?','It does not generate the correct canonical fluctuations. Use Langevin or Nose-Hoover for production.'],['What does the Langevin friction coefficient control?','How strongly velocities are damped and re-randomized; larger values couple to the bath faster but slow real dynamics.']]});

day(5,2,{title:'Barostats and NPT equilibration',
 goal:'Equilibrate density and decide, from data, when it has.',
 read:[['Lemkul: lysozyme tutorial, NPT equilibration','http://www.mdtutorials.com/gmx/lysozyme/index.html','25 min'],['OpenMM user guide: barostats','https://docs.openmm.org/latest/userguide/','15 min']],
 sprint:{title:'Sprint: NPT run and a density-plateau test',needs:'OpenMM',
  problem:'<p>Add a Monte Carlo barostat at 1 bar and 300 K, run 500 ps, log density and volume, and decide whether density has equilibrated by comparing the first-half and second-half means.</p>',
  hint:'<p>After <code>system.addForce</code> call <code>context.reinitialize(preserveState=True)</code>.</p>',
  solution:'w5d2'},
 recall:[['How do you know NPT density has equilibrated?','Running density stops drifting and first-half and second-half means agree within their errors.'],['Why can the density be wrong even when it plateaus?','The water model and force field set the density. A plateau at the wrong value means a model or setup problem, not an unconverged run.'],['What happens if you start NPT before minimization and heating?','Large forces and a mismatched box can make the barostat jump and destabilize the run.']]});

day(5,3,{title:'PME, constraints, timestep and hydrogen mass repartitioning',
 goal:'Find where the timestep breaks energy conservation, and what constraints and HMR buy.',
 read:[['OpenMM user guide: theory of nonbonded forces and constraints','https://docs.openmm.org/latest/userguide/','25 min'],['Amber GPU performance page: what 2 fs and 4 fs runs look like','https://ambermd.org/GPUPerformance.php','10 min']],
 sprint:{title:'Sprint: energy drift against timestep',needs:'OpenMM',
  problem:'<p>In the NVE ensemble, measure energy drift per atom for 1, 2 and 4 fs, with and without hydrogen mass repartitioning. Where does conservation fail?</p>',
  hint:'<p>Use a <code>VerletIntegrator</code>, short runs, and pass <code>hydrogenMass=3*amu</code> to <code>createSystem</code>.</p>',
  solution:'w5d3'},
 recall:[['What does PME compute that a plain cutoff cannot?','Long-range electrostatics in a periodic box through Ewald summation on a grid.'],['Why can you use 2 fs with constraints?','Constraining bonds to hydrogen removes the fastest vibrations.'],['What is the trade-off with HMR?','You can use about 4 fs, but changing masses alters dynamics slightly; check that observables of interest do not change.']]});

day(5,4,{title:'Integration: production, replicas and seeds',
 goal:'Launch three independent replicas that differ only in their random numbers and write restartable output.',
 read:[WITH(GROSS,'the parts on multiple independent trajectories','20 min'),['OpenMM user guide: reporters and checkpoints','https://docs.openmm.org/latest/userguide/','10 min']],
 sprint:{title:'Sprint: three replicas, seeds 101, 202, 303',needs:'OpenMM',
  problem:'<p>Starting from one equilibrated state, run three replicas that differ only in the integrator seed and the initial velocities. Write a trajectory and a CSV for each and save a restart state. Plot the three energy and temperature traces.</p>',
  hint:'<p>Save the state with <code>simulation.saveState</code> after equilibration, and load it for each replica.</p>',
  solution:'w5d4'},
 recall:[['Why three independent replicas rather than one run three times longer?','They sample different basins and give an honest between-replica error bar.'],['What must stay identical across replicas?','The starting coordinates, force field, protocol and box. Only the random numbers differ.'],['Why are your Stage 5 and 6 seeds 101, 202 and 303?','Fixed seeds make runs reproducible and comparable across ligands.']]});

day(6,1,{title:'Trajectory formats and loading',
 goal:'Load one trajectory with two libraries and prove they agree, including the nm versus angstrom trap.',
 read:[['MDAnalysis: quick start guide','https://userguide.mdanalysis.org/stable/examples/quickstart.html','20 min'],['MDTraj documentation','https://www.mdtraj.org/','15 min']],
 explore:[['MDTraj examples (GitHub)','https://github.com/mdtraj/mdtraj/tree/master/examples'],['cpptraj manual','https://amber-md.github.io/cpptraj/CPPTRAJ.xhtml']],
 sprint:{title:'Sprint: MDAnalysis and MDTraj agree on one trajectory',needs:'MDAnalysis and MDTraj',
  problem:'<p>Load the same trajectory with MDAnalysis and MDTraj, compare atom and frame counts, and confirm the first-frame coordinates match after converting nanometres to angstroms.</p>',
  hint:'<p>MDTraj coordinates are in nanometres. Multiply by 10.</p>',
  solution:'w6d1'},
 recall:[['Which formats does each tool read?','Both read NetCDF, DCD, XTC and more; pytraj and cpptraj are Amber-native.'],['What is the units trap?','MDTraj uses nanometres; MDAnalysis and Amber use angstroms.'],['Why keep trajectories out of git?','They are large and binary. Commit inputs and analysis code, not trajectories.']]});

day(6,2,{title:'RMSD, RMSF and the Kabsch algorithm',
 goal:'Write the superposition that sits behind every RMSD, then use the library as a check.',
 read:[['MDAnalysis user guide: alignments and RMS fitting','https://userguide.mdanalysis.org/stable/index.html','20 min']],
 sprint:{title:'Sprint: Kabsch superposition from scratch',tested:true,
  problem:'<p>Implement the Kabsch algorithm with an SVD. Test it on a randomly rotated and translated copy of a structure with small noise, and show that a mirror image cannot be fixed by a proper rotation.</p>',
  hint:'<p>Centre both sets, take the SVD of the 3x3 covariance, and flip the sign of the last column if the determinant is negative.</p>',
  solution:'w6d2',
  why:'<p>The determinant guard is the whole difference between a rotation and a reflection. Skipping it produces beautiful, wrong RMSDs.</p>',
  extra:'<p class="note-small">Pairs with problem 14 in the review starter.</p>'},
 recall:[['Why superpose before RMSD?','Overall translation and rotation would otherwise dominate the number.'],['What does RMSF show that RMSD does not?','Which residues move most, averaged over time, instead of one frame against one reference.'],['Why the determinant check in Kabsch?','To exclude improper rotations (reflections).']]});

day(6,3,{title:'SASA, PCA and clustering',
 goal:'Project a trajectory onto its largest motions and cluster conformational states, knowing what each step assumes.',
 read:[['MDTraj: SASA with Shrake-Rupley (examples folder)','https://github.com/mdtraj/mdtraj/tree/master/examples','15 min'],['scikit-learn: k-means and PCA','https://scikit-learn.org/stable/user_guide.html','20 min']],
 sprint:{title:'Sprint: PCA and k-means on a synthetic two-state trajectory',tested:true,
  problem:'<p>Build a fake aligned trajectory with two conformational states along one collective motion, run PCA with an SVD, cluster the first two components with k-means, and check that PC1 aligns with the planted motion and that clusters recover the states.</p>',
  hint:'<p>Mean-centre the (frames, 3N) matrix, take <code>np.linalg.svd</code>, and project with <code>Xc @ Vt[:2].T</code>.</p>',
  solution:'w6d3',
  why:'<p>PCA assumes the frames are aligned and describes only what was sampled. A trajectory that never visits a state cannot show it.</p>'},
 recall:[['What do the first principal components usually capture?','The largest collective motions present in the sampled data.'],['What does PCA assume about the input frames?','That they are aligned, so overall rotation and translation do not dominate the variance.'],['Why can clustering be misleading?','The number of clusters and the metric are choices, and clusters in a short run may not be real states.']]});

day(6,4,{title:'Integration: umbrella sampling and WHAM',
 goal:'Recover a free-energy profile from biased windows, and see why overlap is non-negotiable.',
 read:[['Lemkul: umbrella sampling tutorial','http://www.mdtutorials.com/gmx/umbrella/index.html','30 min'],['Alchemistry: free-energy background','https://alchemistry.org/wiki/Main_Page','optional']],
 sprint:{title:'Sprint: a minimal WHAM on a 1-D double well',tested:true,
  problem:'<p>Sample a 1-D double well with 17 harmonic umbrella windows using Metropolis Monte Carlo, then implement the self-consistent WHAM equations and compare the recovered profile with the exact potential.</p>',
  hint:'<p>P(x) = ΣH_i(x) / Σ N_i exp((f_i − bias_i(x))/kT), then update each f_i from P(x). Iterate until f stops changing.</p>',
  solution:'w6d4',
  why:'<p>Remove half the windows and watch the profile collapse in the gaps. That is what poor overlap looks like in a real calculation.</p>'},
 recall:[['When is plain MD hopeless?','When the event crosses barriers of many kT on timescales you cannot reach.'],['Why must windows overlap?','WHAM links windows through overlapping histograms; without overlap their free-energy offsets are undefined.'],['What are two other enhanced-sampling families?','Replica exchange and metadynamics (also accelerated MD).']]});

/* ===== PHASE 2: weeks 7-10 ===== */
const MLCC=['Google Machine Learning Crash Course','https://developers.google.com/machine-learning/crash-course'];
const DMOL=['dmol.pub: Deep Learning for Molecules and Materials','https://dmol.pub/'];
const ISLP=['ISLP: An Introduction to Statistical Learning with Python (free)','https://www.statlearning.com/'];

day(7,1,{title:'Linear regression, two ways',
 goal:'Fit a linear model with the normal equations and with gradient descent, and have scikit-learn referee both.',
 read:[[MLCC[0]+': linear regression module',MLCC[1],'25 min'],[DMOL[0]+': the regression and model assessment chapter',DMOL[1],'20 min']],
 watch:[['StatQuest on YouTube: linear regression and gradient descent','https://www.youtube.com/@statquest']],
 explore:[['homemade-machine-learning: linear regression with the math','https://github.com/trekhleb/homemade-machine-learning'],['Made With ML','https://madewithml.com/']],
 sprint:{title:'Sprint: normal equations, gradient descent and scikit-learn agree',tested:true,
  problem:'<p>Generate data from a known linear model with noise. Fit it by the normal equations, by gradient descent on the mean squared error, and with <code>LinearRegression</code>. All three must agree.</p>',
  hint:'<p>Add a column of ones for the bias. Normal equations: solve (XᵀX) w = Xᵀy.</p>',
  solution:'w7d1'},
 recall:[['What does ordinary least squares assume?','Linearity, independent errors with constant variance, and features that are not perfectly collinear.'],['Why solve the normal equations with solve() and not by inverting XᵀX?','Solving is faster and numerically more stable than forming an explicit inverse.'],['What does the learning rate do in gradient descent?','It sets the step size: too large diverges, too small crawls.']]});

day(7,2,{title:'Regularization and bias-variance',
 goal:'See overfitting happen on purpose and watch ridge regression fix it.',
 read:[[ISLP[0]+': chapter 6 on ridge and the lasso',ISLP[1],'30 min']],
 watch:[['StatQuest on YouTube: ridge, lasso and elastic net','https://www.youtube.com/@statquest']],
 sprint:{title:'Sprint: sweep lambda and plot the U-curve',tested:true,
  problem:'<p>Fit ridge regression on 30 training points with 15 features, sweep λ over six orders of magnitude, and compare training and held-out RMSE. Find the best λ.</p>',
  hint:'<p>Ridge solution: (XᵀX + λI)⁻¹ Xᵀy. Evaluate on a large fresh test set.</p>',
  solution:'w7d2',
  why:'<p>Training error only rises with λ. Test error falls and then rises: the minimum is the bias-variance sweet spot.</p>'},
 recall:[['What does increasing λ do to bias and variance?','It increases bias and decreases variance.'],['Why does training error always rise with λ?','The penalty stops the model fitting the training data as closely.'],['When is the lasso preferable to ridge?','When you expect only a few features to matter, because it drives some weights exactly to zero.']]});

day(7,3,{title:'Cross-validation and metrics',
 goal:'Implement k-fold cross-validation by hand and reproduce scikit-learn on the same folds.',
 read:[['scikit-learn: cross-validation','https://scikit-learn.org/stable/modules/cross_validation.html','25 min'],[MLCC[0]+': classification metrics',MLCC[1],'15 min']],
 sprint:{title:'Sprint: k-fold from scratch, checked against scikit-learn',tested:true,

  hint:'<p><code>make_pipeline(StandardScaler(), SelectKBest(f_regression, k=20), Ridge())</code> fits all steps on the training fold only.</p>',
  solution:'w7d4',
  extra:fold('Scaffold split with RDKit <span class="tag warn">Not run by me: needs RDKit</span>',codeBlockHtml(`from collections import defaultdict
from rdkit import Chem
from rdkit.Chem.Scaffolds import MurckoScaffold

def scaffold_split(smiles, frac_train=0.8):
    """Whole scaffolds go to train or test, never both."""
    groups = defaultdict(list)
    for i, smi in enumerate(smiles):
        scaf = MurckoScaffold.MurckoScaffoldSmiles(mol=Chem.MolFromSmiles(smi), includeChirality=False)
        groups[scaf].append(i)
    train, test, n = [], [], len(smiles)
    for g in sorted(groups.values(), key=len, reverse=True):      # biggest scaffolds first
        (train if len(train) + len(g) <= frac_train * n else test).extend(g)
    return train, test`))},
 recall:[['Why is a random split too optimistic for congeneric molecules and for MD frames?','Near-duplicates land on both sides, so the model is graded on data it has effectively seen.'],['Name a classic leakage bug and its fix.','Scaling or selecting on all data before splitting. Fit transforms inside the training fold.'],['What does a null test (shuffled targets) tell you?','Whether your pipeline can score well by accident. If it does, the real score means little.']]});

const LIMERZ=['Li and Merz, Metal Ion Modeling Using Classical Mechanics (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC5312828'];

day(11,1,{title:'Three strategies for metal ions, and when each fails',
 goal:'Hold a map of nonbonded, bonded, dummy-atom, ligand-field and QM-based approaches, and choose between them for a given site.',
 read:[[LIMERZ[0]+': introduction and the classical models',LIMERZ[1],'35 min'],[AMBMET[0]+': overview of the modelling strategies',AMBMET[1],'10 min']],
 explore:[['Deeth et al. review of ligand-field molecular mechanics (free, preview for week 12)','https://wrap.warwick.ac.uk/28222/']],
 sprint:{title:'Sprint: a decision tree for choosing a metal model',
  problem:'<p>Draw a decision tree (on paper or as nested bullets) that takes a metal site and ends in one of: nonbonded 12-6 or 12-6-4, bonded (MCPB.py or ZAFF), cationic dummy atom, restrained nonbonded, ligand-field molecular mechanics, QM/MM, or an ML potential. Your key questions should include whether the coordination changes during the run, whether the site is rigid and directional, and whether the metal is open shell. Then test your tree on ZnPc, CuPc and a zinc finger.</p>',
  hint:'<p>Start from the question that eliminates the most options: does the coordination sphere change during the simulation?</p>',
  solutionHtml:'<ul><li><b>Does the coordination sphere change during the run</b> (exchange, binding, unbinding, coordination number changes)?<ul><li>Yes: use a nonbonded model (12-6, or 12-6-4 for highly charged ions), possibly with restraints. If bond making and breaking or electronic effects matter, move to QM/MM or an ML potential.</li><li>No: is the site rigid and directional?<ul><li>Yes, and similar sites are parameterized: ZAFF (four-coordinate zinc) or an MCPB.py bonded model fitted to QM.</li><li>Hard to hold with bonded terms, or several waters on one metal distort it: a cationic dummy atom model, or a restrained nonbonded model.</li></ul></li></ul></li><li><b>Is the metal open shell</b> (Cu(II), many Fe, Mn, Co states) with Jahn-Teller or spin effects? Fixed bonded and nonbonded models are approximate. Use ligand-field molecular mechanics, QM/MM or an ML potential, and limit your claims.</li><li><b>Does the chemistry involve redox or bond breaking?</b> QM/MM or reactive potentials.</li></ul><p><b>Applied.</b> ZnPc: Zn(II) is d10, the N4 cavity is rigid and planar, so an MCPB.py bonded model is reasonable. CuPc: same geometry but d9 and open shell, so the bonded model is a documented approximation. Zinc finger: four-coordinate, rigid, standard, so ZAFF or MCPB.py.</p>'},
 recall:[['What does the bonded model buy you, and what can it never represent?','Fixed coordination geometry and stability at low cost. It cannot represent bond breaking or forming or changes in coordination number.'],['What does the nonbonded model give up?','Directionality: it relies on charge and van der Waals terms, so it can distort coordination geometry for sites that need it.'],['Why is it risky to carry parameters from a Zn(II) site to a Cu(II) site?','Different electronic structure, bond lengths and coordination preferences; Cu(II) also has Jahn-Teller effects.']]});

day(11,2,{title:'12-6 against 12-6-4',
 goal:'See what the extra −C4/r⁴ term does to the shape of an ion-water potential.',
 read:[['Li, Song and Merz: 12-6-4 parameterization for highly charged ions (open access)','https://pmc.ncbi.nlm.nih.gov/articles/PMC4306492','30 min'],[AMBMET[0]+': nonbonded model section',AMBMET[1],'10 min']],
 sprint:{title:'Sprint: plot 12-6 and 12-6-4 and read the well',tested:true,
  problem:'<p>Plot the ion-water pair potential for a plain 12-6 form and for 12-6-4 with two different C4 values. Report how the well depth and position change. The numbers are illustrative, not a published parameter set.</p>',
  hint:'<p>V(r) = ε[(Rmin/r)¹² − 2(Rmin/r)⁶] − C4/r⁴.</p>',
  solution:'w11d2',
  why:'<p>The r⁻⁴ term is the ion-induced dipole interaction. It is long-ranged and strong for highly charged ions, so adding it lets one parameter set describe both hydration free energy and ion-oxygen distance. C4 is fitted for each ion and water-model pair.</p>'},
 recall:[['Why does 12-6-4 outperform 12-6 for highly charged ions?','The −C4/r⁴ term represents ion-induced dipole interaction that a plain 12-6 potential lacks.'],['Why must C4 be tied to a water model?','It was fitted with a specific water model; the induced-dipole response depends on that model.'],['What is the parameter-uniqueness problem?','Several different (radius, well depth) pairs can reproduce one target such as hydration free energy; you need more than one target (distance, coordination number) to pin them down.']]});

day(11,3,{title:'The Seminario method and metal-site charges',

 read:[['MCPB.py bonded model workflow (Amber tutorial)','https://ambermd.org/tutorials/advanced/tutorial20/bonded_model.php','20 min'],[LIMERZ[0]+': the bonded model section',LIMERZ[1],'20 min']],
 sprint:{title:'Sprint: Seminario force constant from a Hessian block',tested:true,
  problem:'<p>Given a Cartesian Hessian for a diatomic whose bond points along an arbitrary direction, compute the bond force constant by taking the 3x3 coupling block between the two atoms, diagonalizing it, and projecting its eigenvectors on the bond direction. Recover the known k. Then add an off-axis perturbation and see how robust the estimate is.</p>',
  hint:'<p>k = −Σ λ_i |u · v_i| where the λ_i and v_i come from the coupling sub-block and u is the unit bond vector.</p>',
  solution:'w11d3',
  why:'<p>This is the logic behind step 2 of MCPB.py (Seminario is its default). Angle force constants use the same idea with the two relevant sub-blocks.</p>'},
 recall:[['Why derive metal-ligand force constants from the QM Hessian?','No generic parameters exist for most metal sites; the Hessian gives site-specific stiffness consistently.'],['What does RESP charge fitting do for the metal site?','It fits atomic charges to the QM electrostatic potential, so the metal and its ligating atoms carry charges consistent with the site.'],['What is the units rule for the Seminario output?','It is in the energy over length-squared units of the Hessian you gave it; convert to kcal/mol/Å² before comparing with the 200 limit.']]});

day(11,4,{title:'Integration: the cationic dummy atom model',
 goal:'Build the geometry and charges for a tetrahedral dummy-atom zinc and check them.',
 read:[[AMBMET[0]+' (follow the dummy atom tutorial link)',AMBMET[1],'25 min'],[LIMERZ[0]+': cationic dummy atom model',LIMERZ[1],'15 min']],
